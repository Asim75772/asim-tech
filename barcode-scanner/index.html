<script
src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#020b18;
color:white;
}

z-index:1000;
background:#020914;
border-bottom:1px solid #12304a;
padding:18px 5%;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:bold;
}

.logo span{
color:#008cff;
}

.home{
text-decoration:none;
color:white;
border:1px solid #24425d;
padding:10px 17px;
border-radius:12px;
}

.container{
width:94%;
max-width:850px;
margin:auto;
padding:40px 0 70px;
}

.hero{
text-align:center;
margin-bottom:35px;
}

.hero h1{
font-size:38px;
}

.hero h1 span{
color:#008cff;
}

.hero p{
color:#8fa7ba;
}

.card{
background:#031827;
border:1px solid #16405d;
border-radius:20px;
padding:22px;
margin-bottom:25px;
}

.card h2{
margin-top:0;
}

#reader{
width:100%;
max-width:600px;
margin:auto;
background:#000;
border-radius:15px;
overflow:hidden;
}

.status{
margin-top:15px;
padding:15px;
border-radius:12px;
text-align:center;
background:#061f31;
color:#9bb0c0;
line-height:1.6;
}

.success{
color:#00e676;
}

.error{
color:#ff5968;
}

button{
width:100%;
border:0;
border-radius:12px;
padding:15px;
margin-top:12px;
font-size:16px;
font-weight:bold;
color:white;
cursor:pointer;
}

.blue{
background:#087ff5;
}

.green{
background:#00b956;
}

.red{
background:#ff3040;
}

.orange{
background:#ff8a00;
}

textarea,
input,
select{
width:100%;
background:#061d2c;
border:1px solid #1c425b;
color:white;
border-radius:12px;
padding:15px;
font-size:16px;
outline:none;
}

textarea{
min-height:110px;
resize:vertical;
}

.label{
display:block;
color:#91a9bd;
margin:12px 0 7px;
}

.result{
margin-top:15px;
padding:15px;
border-radius:12px;
background:#061d2c;
word-break:break-word;
display:none;
}

#qrcode{
background:white;
padding:20px;
border-radius:15px;
width:max-content;
max-width:100%;
margin:20px auto;
}

#barcodeBox{
background:white;
border-radius:15px;
padding:20px;
margin-top:20px;
text-align:center;
overflow:auto;
}

#barcode{
max-width:100%;
height:auto;
}

footer{
text-align:center;
padding:30px;
color:#71889c;
border-top:1px solid #102b40;
}

</style>

<body>


<header>

<div class="logo">
▲ ASIM <span>TECH</span>
</div>

<a
class="home"
href="/"
>
← Asim Tech
</a>

</header>


<main class="container">


<section class="hero">

<h1>
ASIM <span>Barcode & QR</span> Scanner
</h1>

<p>
Scan • Create • Save • Download
</p>

</section>


<!-- CAMERA -->

<section class="card">

<h2>📷 Camera Scanner</h2>

<div id="reader"></div>

<div
id="cameraStatus"
class="status"
>
Camera is stopped.
</div>

<button
id="startCamera"
class="blue"
>
📷 Start Camera
</button>

<button
id="stopCamera"
class="red"
>
⏹ Stop Camera
</button>

<button
id="switchCamera"
class="orange"
>
🔄 Switch Camera
</button>

<div
id="scanResult"
class="result">
</div>

</section>


<!-- QR -->

<section class="card">

<h2>▣ QR Code Generator</h2>

<label class="label">
Enter text or URL
</label>

<textarea
id="qrText"
placeholder="Enter text, website URL, phone number, Wi-Fi information etc."
></textarea>

<button
id="generateQR"
class="blue"
>
▣ Generate QR
</button>

<div id="qrcode"></div>

<button
id="downloadQR"
class="green"
>
↓ Download PNG
</button>

</section>


<!-- BARCODE -->

<section class="card">

<h2>🏷️ Barcode Generator</h2>

<label class="label">
Barcode Format
</label>

<select id="barcodeFormat">

<option value="CODE128">
CODE 128
</option>

<option value="CODE39">
CODE 39
</option>

<option value="EAN13">
EAN-13
</option>

<option value="EAN8">
EAN-8
</option>

</select>


<label class="label">
Barcode Text
</label>

<input
id="barcodeText"
value="9547222144"
placeholder="Enter barcode number"
>


<button
id="generateBarcode"
class="blue"
>
🏷️ Generate Barcode
</button>


<div id="barcodeBox">

<svg id="barcode"></svg>

</div>


<button
id="downloadBarcode"
class="green"
>
↓ Download Barcode PNG
</button>

</section>


<section
class="card"
style="text-align:center"
>

<h2>🔒 Private</h2>

<p style="color:#8fa7ba;line-height:1.6;">
Your scanned data stays on your device.
</p>

</section>


</main>


<footer>

© 2026 Asim Tech • Barcode & QR Scanner

</footer>


<script>

/* CAMERA */

let scanner=null;

let cameras=[];

let currentCamera=0;

let running=false;


const status=
document.getElementById("cameraStatus");

const result=
document.getElementById("scanResult");


function setStatus(text,type=""){

status.className="status "+type;

status.innerHTML=text;

}


async function getCameras(){

try{

if(!window.isSecureContext){

throw new Error("HTTPS required");

}

cameras=
await Html5Qrcode.getCameras();

if(!cameras.length){

throw new Error("No camera");

}

return cameras;

}catch(e){

console.log(e);

setStatus(
"❌ Camera permission denied or camera unavailable.<br><br>Please allow Camera permission.",
"error"
);

return [];

}

}


async function startCamera(){

if(running)return;


setStatus("⏳ Opening camera...");


cameras=await getCameras();


if(!cameras.length)return;


if(currentCamera>=cameras.length){

currentCamera=0;

}


scanner=
new Html5Qrcode("reader");


try{

await scanner.start(

cameras[currentCamera].id,

{

fps:10,

qrbox:function(w,h){

let size=
Math.floor(Math.min(w,h)*0.7);

return{
width:size,
height:size
};

}

},

function(text){

result.style.display="block";

result.innerHTML=
"<strong>✅ Scanned Result:</strong><br><br>"+
escapeHtml(text);


setStatus(
"✅ Code detected successfully.",
"success"
);


if(/^https?:\/\//i.test(text)){

if(confirm(
"Website detected.\n\nOpen it?"
)){

window.open(text,"_blank");

}

}

},

function(error){

}

);


running=true;

setStatus(
"🟢 Camera running. Point camera at QR or barcode.",
"success"
);


}catch(e){

console.log(e);

running=false;

setStatus(
"❌ Camera could not be opened.<br><br>Please allow Camera permission and try again.",
"error"
);

try{

await scanner.clear();

}catch(x){}

scanner=null;

}

}


async function stopCamera(){

try{

if(scanner && running){

await scanner.stop();

await scanner.clear();

}

}catch(e){

console.log(e);

}

scanner=null;

running=false;

setStatus(
"Camera is stopped."
);

}


async function switchCamera(){

cameras=await getCameras();


if(cameras.length<2){

setStatus(
"Only one camera is available.",
"error"
);

return;

}


const wasRunning=running;


if(wasRunning){

await stopCamera();

}


currentCamera++;


if(currentCamera>=cameras.length){

currentCamera=0;

}


if(wasRunning){

await startCamera();

}else{

setStatus(
"Camera selected. Tap Start Camera."
);

}

}


document
.getElementById("startCamera")
.onclick=startCamera;


document
.getElementById("stopCamera")
.onclick=stopCamera;


document
.getElementById("switchCamera")
.onclick=switchCamera;


/* QR */

let qr=null;


document
.getElementById("generateQR")
.onclick=function(){

let text=
document
.getElementById("qrText")
.value
.trim();


if(!text){

alert(
"Please enter text or URL first."
);

return;

}


const box=
document.getElementById("qrcode");


box.innerHTML="";


qr=new QRCode(
box,
{

text:text,

width:300,

height:300,

colorDark:"#000000",

colorLight:"#ffffff",

correctLevel:
QRCode.CorrectLevel.H

}
);

};


/* QR DOWNLOAD */

document
.getElementById("downloadQR")
.onclick=function(){

const box=
document.getElementById("qrcode");

const canvas=
box.querySelector("canvas");

const img=
box.querySelector("img");


if(canvas){

downloadCanvas(
canvas,
"asim-qr-code.png"
);

return;

}


if(img){

const link=
document.createElement("a");

link.href=img.src;

link.download=
"asim-qr-code.png";

document.body.appendChild(link);

link.click();

document.body.removeChild(link);

return;

}


alert(
"Please generate QR code first."
);

};


/* BARCODE */

document
.getElementById("generateBarcode")
.onclick=function(){

const text=
document
.getElementById("barcodeText")
.value
.trim();


const format=
document
.getElementById("barcodeFormat")
.value;


if(!text){

alert(
"Please enter barcode text."
);

return;

}


try{

JsBarcode(
"#barcode",
text,
{

format:format,

lineColor:"#000000",

background:"#ffffff",

width:2,

height:100,

displayValue:true,

fontSize:18,

margin:15

}
);

}catch(e){

alert(
"Invalid value for "+format
);

}

};


/* BARCODE DOWNLOAD */

document
.getElementById("downloadBarcode")
.onclick=function(){

const svg=
document.getElementById("barcode");


if(!svg.innerHTML.trim()){

alert(
"Please generate barcode first."
);

return;

}


const source=
new XMLSerializer()
.serializeToString(svg);


const blob=
new Blob(
[source],
{
type:"image/svg+xml"
}
);


const url=
URL.createObjectURL(blob);


const img=
new Image();


img.onload=function(){

const canvas=
document.createElement("canvas");


canvas.width=
img.width || 600;


canvas.height=
img.height || 150;


const ctx=
canvas.getContext("2d");


ctx.fillStyle="#ffffff";


ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


ctx.drawImage(
img,
0,
0
);


URL.revokeObjectURL(url);


downloadCanvas(
canvas,
"asim-barcode.png"
);

};


img.src=url;

};


/* DOWNLOAD */

function downloadCanvas(canvas,name){

canvas.toBlob(function(blob){

if(!blob){

alert("Download failed.");

return;

}


const url=
URL.createObjectURL(blob);


const a=
document.createElement("a");


a.href=url;

a.download=name;


document.body.appendChild(a);

a.click();

document.body.removeChild(a);


setTimeout(
function(){
URL.revokeObjectURL(url);
},
1000
);

},"image/png");

}


/* ESCAPE */

function escapeHtml(text){

const div=
document.createElement("div");

div.textContent=text;

return div.innerHTML;

}


/* DEFAULT BARCODE */

window.onload=function(){

try{

JsBarcode(
"#barcode",
"9547222144",
{

format:"CODE128",

lineColor:"#000000",

background:"#ffffff",

width:2,

height:100,

displayValue:true,

fontSize:18,

margin:15

}
);

}catch(e){

console.log(e);

}

};

</script>


</body>
</html>
