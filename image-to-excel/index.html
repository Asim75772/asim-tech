<script>

/* =====================================================
   ASIM TECH IMAGE TO EXCEL
   IMPROVED TABLE RECONSTRUCTION
===================================================== */

let selectedFile = null;
let tableData = [];
let currentColumns = 1;


/* =====================================================
   ELEMENTS
===================================================== */

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const previewImage = document.getElementById("previewImage");
const previewName = document.getElementById("previewName");
const extractBtn = document.getElementById("extractBtn");
const clearBtn = document.getElementById("clearBtn");
const language = document.getElementById("language");
const columns = document.getElementById("columns");
const progressBox = document.getElementById("progressBox");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");
const statusBox = document.getElementById("status");
const resultCard = document.getElementById("resultCard");
const headerRow = document.getElementById("headerRow");
const tableBody = document.getElementById("tableBody");
const downloadExcel = document.getElementById("downloadExcel");
const downloadCSV = document.getElementById("downloadCSV");

const addColumn = document.getElementById("addColumn");

/* =====================================================
   STATUS
===================================================== */

function showStatus(message,type){

    statusBox.textContent = message;
    statusBox.className = "status " + type;

}


/* =====================================================
   IMAGE SELECT
===================================================== */

imageInput.addEventListener("change",function(event){

    const file =
        event.target.files &&
        event.target.files[0];

    if(!file) return;

    if(!file.type.startsWith("image/")){

        showStatus(
            "Please select an image file.",
            "error"
        );

        return;
    }

    selectedFile = file;

    const reader = new FileReader();

    reader.onload = function(e){

        previewImage.src = e.target.result;

        previewName.textContent = file.name;

        preview.style.display = "block";

        extractBtn.disabled = false;

        showStatus(
            "Image selected successfully.",
            "success"
        );

    };

    reader.onerror = function(){

        showStatus(
            "Could not read the image.",
            "error"
        );

    };

    reader.readAsDataURL(file);

});


/* =====================================================
   CLEAR
===================================================== */

clearBtn.addEventListener("click",function(){

    selectedFile = null;

    imageInput.value = "";

    preview.style.display = "none";

    previewImage.src = "";

    previewName.textContent = "";

    extractBtn.disabled = true;

    resultCard.style.display = "none";

    tableData = [];

    currentColumns = 1;

    headerRow.innerHTML = "";

    tableBody.innerHTML = "";

    progressBox.style.display = "none";

    statusBox.className = "status";

});


/* =====================================================
   IMAGE PREPARATION
===================================================== */

async function prepareImage(file){

    return new Promise(function(resolve,reject){

        const img = new Image();

        const url = URL.createObjectURL(file);

        img.onload = function(){

            try{

                const maxWidth = 3000;

                let width = img.naturalWidth;
                let height = img.naturalHeight;

                if(width > maxWidth){

                    const scale =
                        maxWidth / width;

                    width =
                        Math.round(width * scale);

                    height =
                        Math.round(height * scale);
                }

                const canvas =
                    document.createElement("canvas");

                canvas.width = width;
                canvas.height = height;

                const ctx =
                    canvas.getContext(
                        "2d",
                        {
                            willReadFrequently:true
                        }
                    );

                ctx.fillStyle = "#ffffff";

                ctx.fillRect(
                    0,
                    0,
                    width,
                    height
                );

                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );

                canvas.toBlob(
                    function(blob){

                        URL.revokeObjectURL(url);

                        if(!blob){

                            reject(
                                new Error(
                                    "Image conversion failed."
                                )
                            );

                            return;
                        }

                        resolve(blob);

                    },
                    "image/png",
                    1
                );

            }
            catch(error){

                URL.revokeObjectURL(url);

                reject(error);

            }

        };

        img.onerror = function(){

            URL.revokeObjectURL(url);

            reject(
                new Error(
                    "Could not load image."
                )
            );

        };

        img.src = url;

    });

}


/* =====================================================
   VALID OCR WORD
===================================================== */

function validWord(word){

    if(!word || !word.text || !word.bbox){

        return false;
    }

    const text =
        String(word.text).trim();

    if(!text){

        return false;
    }

    const x0 = Number(word.bbox.x0);
    const x1 = Number(word.bbox.x1);
    const y0 = Number(word.bbox.y0);
    const y1 = Number(word.bbox.y1);

    return (
        Number.isFinite(x0) &&
        Number.isFinite(x1) &&
        Number.isFinite(y0) &&
        Number.isFinite(y1) &&
        x1 > x0 &&
        y1 > y0
    );

}


/* =====================================================
   MAKE ROWS
===================================================== */

function makeRows(words){

    const valid =
        (words || [])
        .filter(validWord)
        .map(function(w){

            return {

                text:
                    String(w.text).trim(),

                bbox:{

                    x0:Number(w.bbox.x0),
                    x1:Number(w.bbox.x1),
                    y0:Number(w.bbox.y0),
                    y1:Number(w.bbox.y1)

                }

            };

        });


    if(!valid.length){

        return [];
    }


    const heights =
        valid
        .map(
            w =>
            w.bbox.y1 -
            w.bbox.y0
        )
        .sort(
            (a,b) => a-b
        );


    const medianHeight =
        heights[
            Math.floor(
                heights.length / 2
            )
        ] || 20;


    const tolerance =
        Math.max(
            8,
            medianHeight * 0.55
        );


    valid.sort(function(a,b){

        const ay =
            (
                a.bbox.y0 +
                a.bbox.y1
            ) / 2;

        const by =
            (
                b.bbox.y0 +
                b.bbox.y1
            ) / 2;

        return ay - by;

    });


    const rows = [];


    for(const word of valid){

        const centerY =
            (
                word.bbox.y0 +
                word.bbox.y1
            ) / 2;


        let bestRow = null;
        let bestDistance = Infinity;


        for(const row of rows){

            const distance =
                Math.abs(
                    row.centerY -
                    centerY
                );


            if(
                distance <= tolerance &&
                distance < bestDistance
            ){

                bestRow = row;
                bestDistance = distance;

            }

        }


        if(!bestRow){

            bestRow = {

                centerY:centerY,

                words:[]

            };

            rows.push(bestRow);

        }


        bestRow.words.push(word);


        bestRow.centerY =
            bestRow.words.reduce(
                function(sum,w){

                    return sum +
                        (
                            w.bbox.y0 +
                            w.bbox.y1
                        ) / 2;

                },
                0
            ) /
            bestRow.words.length;

    }


    rows.sort(
        (a,b) =>
        a.centerY -
        b.centerY
    );


    rows.forEach(function(row){

        row.words.sort(
            (a,b) =>
            a.bbox.x0 -
            b.bbox.x0
        );

    });


    return rows;

}


/* =====================================================
   WORDS → CELL BLOCKS
===================================================== */

function makeBlocks(row){

    if(
        !row ||
        !row.words ||
        !row.words.length
    ){

        return [];
    }


    const words =
        [...row.words].sort(
            (a,b) =>
            a.bbox.x0 -
            b.bbox.x0
        );


    const heights =
        words
        .map(
            w =>
            w.bbox.y1 -
            w.bbox.y0
        )
        .sort(
            (a,b) => a-b
        );


    const medianHeight =
        heights[
            Math.floor(
                heights.length / 2
            )
        ] || 20;


    /*
       Words with a small gap are considered
       part of the same cell.
    */

    const gapThreshold =
        Math.max(
            15,
            medianHeight * 1.35
        );


    const blocks = [];


    for(const word of words){

        if(!blocks.length){

            blocks.push({

                words:[word],

                x0:word.bbox.x0,

                x1:word.bbox.x1

            });

            continue;
        }


        const last =
            blocks[
                blocks.length - 1
            ];


        const gap =
            word.bbox.x0 -
            last.x1;


        if(gap <= gapThreshold){

            last.words.push(word);

            last.x1 =
                Math.max(
                    last.x1,
                    word.bbox.x1
                );

        }
        else{

            blocks.push({

                words:[word],

                x0:word.bbox.x0,

                x1:word.bbox.x1

            });

        }

    }


    return blocks.map(function(block){

        return {

            text:
                block.words
                .map(
                    w =>
                    w.text
                )
                .join(" ")
                .replace(/\s+/g," ")
                .trim(),

            x0:block.x0,

            x1:block.x1,

            centerX:
                (
                    block.x0 +
                    block.x1
                ) / 2

        };

    });

}


/* =====================================================
   CLUSTER COLUMN POSITIONS
===================================================== */

function clusterX(values,k){

    if(!values.length){

        return [];
    }


    if(k <= 1){

        return [

            values.reduce(
                (a,b) => a+b,
                0
            ) /
            values.length

        ];

    }


    const sorted =
        [...values].sort(
            (a,b) => a-b
        );


    let centers = [];


    for(
        let i=0;
        i<k;
        i++
    ){

        const pos =
            Math.round(
                i *
                (
                    sorted.length - 1
                ) /
                (
                    k - 1
                )
            );


        centers.push(
            sorted[pos]
        );

    }


    for(
        let iteration=0;
        iteration<30;
        iteration++
    ){

        const groups =
            Array.from(
                {
                    length:k
                },
                () => []
            );


        for(const value of values){

            let best = 0;

            let distance =
                Math.abs(
                    value -
                    centers[0]
                );


            for(
                let i=1;
                i<centers.length;
                i++
            ){

                const d =
                    Math.abs(
                        value -
                        centers[i]
                    );


                if(d < distance){

                    distance = d;

                    best = i;

                }

            }


            groups[best].push(value);

        }


        let changed = false;


        for(
            let i=0;
            i<k;
            i++
        ){

            if(!groups[i].length){

                continue;
            }


            const newCenter =
                groups[i].reduce(
                    (a,b) => a+b,
                    0
                ) /
                groups[i].length;


            if(
                Math.abs(
                    newCenter -
                    centers[i]
                ) > 0.5
            ){

                changed = true;

            }


            centers[i] =
                newCenter;

        }


        if(!changed){

            break;
        }

    }


    return centers.sort(
        (a,b) => a-b
    );

}


/* =====================================================
   ESTIMATE COLUMNS
===================================================== */

function estimateColumns(rows){

    if(!rows.length){

        return 1;
    }


    const counts =
        rows
        .map(
            row =>
            makeBlocks(row).length
        )
        .filter(
            n =>
            n > 0 &&
            n <= 8
        );


    if(!counts.length){

        return 1;
    }


    const frequency = {};


    counts.forEach(function(n){

        frequency[n] =
            (frequency[n] || 0) + 1;

    });


    let best = 1;
    let bestFrequency = 0;


    Object.keys(frequency)
    .forEach(function(key){

        const n =
            Number(key);


        if(
            frequency[key] >
            bestFrequency
        ){

            best =
                n;

            bestFrequency =
                frequency[key];

        }

    });


    return Math.min(
        8,
        Math.max(
            1,
            best
        )
    );

}


/* =====================================================
   FIND COLUMN CENTRES
===================================================== */

function findColumnCenters(
    rows,
    columnCount
){

    let anchors = [];


    /*
       First preference:
       rows having exactly the expected
       number of blocks.
    */

    rows.forEach(function(row){

        const blocks =
            makeBlocks(row);


        if(
            blocks.length ===
            columnCount
        ){

            blocks.forEach(
                block =>
                anchors.push(
                    block.centerX
                )
            );

        }

    });


    /*
       Second preference:
       rows with more blocks than columns.
    */

    if(!anchors.length){

        rows.forEach(function(row){

            const blocks =
                makeBlocks(row);


            if(
                blocks.length >=
                columnCount
            ){

                blocks
                .slice(
                    0,
                    columnCount
                )
                .forEach(
                    block =>
                    anchors.push(
                        block.centerX
                    )
                );

            }

        });

    }


    /*
       Last fallback:
       use every detected block.
    */

    if(!anchors.length){

        rows.forEach(function(row){

            makeBlocks(row)
            .forEach(
                block =>
                anchors.push(
                    block.centerX
                )
            );

        });

    }


    return clusterX(
        anchors,
        columnCount
    );

}


/* =====================================================
   BUILD TABLE
===================================================== */

function buildTableFromRows(
    rows,
    columnCount
){

    if(!rows.length){

        return [];
    }


    if(columnCount === 1){

        return rows.map(function(row){

            return [

                makeBlocks(row)
                .map(
                    block =>
                    block.text
                )
                .join(" ")
                .trim()

            ];

        });

    }


    let centers =
        findColumnCenters(
            rows,
            columnCount
        );


    if(
        centers.length !==
        columnCount
    ){

        /*
           Geometry fallback.
        */

        const allBlocks =
            rows.flatMap(
                row =>
                makeBlocks(row)
            );


        if(allBlocks.length){

            const minX =
                Math.min(
                    ...allBlocks.map(
                        b => b.x0
                    )
                );


            const maxX =
                Math.max(
                    ...allBlocks.map(
                        b => b.x1
                    )
                );


            const width =
                Math.max(
                    1,
                    maxX - minX
                );


            centers =
                Array.from(
                    {
                        length:
                        columnCount
                    },
                    (_,i) =>
                    minX +
                    width *
                    (
                        i + 0.5
                    ) /
                    columnCount
                );

        }

    }


    const result = [];


    rows.forEach(function(row){

        const blocks =
            makeBlocks(row);


        if(!blocks.length){

            return;
        }


        const cells =
            Array.from(
                {
                    length:
                    columnCount
                },
                () => []
            );


        /*
           Assign each BLOCK to nearest column.
        */

        blocks.forEach(function(block){

            let bestIndex = 0;

            let bestDistance =
                Infinity;


            centers.forEach(
            function(center,index){

                const distance =
                    Math.abs(
                        block.centerX -
                        center
                    );


                if(
                    distance <
                    bestDistance
                ){

                    bestDistance =
                        distance;

                    bestIndex =
                        index;

                }

            });


            cells[bestIndex].push(
                block
            );

        });


        const rowData =
            cells.map(
                cell =>
                cell
                .sort(
                    (a,b) =>
                    a.x0 -
                    b.x0
                )
                .map(
                    block =>
                    block.text
                )
                .join(" ")
                .replace(/\s+/g," ")
                .trim()
            );


        result.push(rowData);

    });


    return result;

}


/* =====================================================
   OCR EXTRACTION
===================================================== */

extractBtn.addEventListener(
"click",
async function(){

    if(!selectedFile){

        showStatus(
            "Please choose an image first.",
            "error"
        );

        return;
    }


    try{

        extractBtn.disabled = true;

        progressBox.style.display =
            "block";

        progressBar.style.width =
            "5%";

        progressText.textContent =
            "Preparing image...";


        const image =
            await prepareImage(
                selectedFile
            );


        progressText.textContent =
            "Starting OCR...";


        const result =
            await Tesseract.recognize(
                image,
                language.value,
                {

                    logger:
                    function(info){

                        if(
                            info.status ===
                            "recognizing text"
                        ){

                            const p =
                                Math.round(
                                    (
                                        info.progress ||
                                        0
                                    ) * 100
                                );


                            progressBar.style.width =
                                (
                                    10 +
                                    p * 0.85
                                ) + "%";


                            progressText.textContent =
                                "Reading image... " +
                                p +
                                "%";

                        }

                    },

                    tessedit_pageseg_mode:"6",

                    preserve_interword_spaces:"1"

                }
            );


        progressText.textContent =
            "Building table...";


        progressBar.style.width =
            "95%";


        const words =
            result.data.words || [];


        const rows =
            makeRows(words);


        let count;


        if(
            columns.value ===
            "auto"
        ){

            count =
                estimateColumns(
                    rows
                );

        }
        else{

            count =
                parseInt(
                    columns.value,
                    10
                );

        }


        if(
            !Number.isFinite(count) ||
            count < 1
        ){

            count = 1;
        }


        currentColumns =
            count;


        if(rows.length){

            tableData =
                buildTableFromRows(
                    rows,
                    count
                );

        }
        else{

            const text =
                result.data.text || "";


            tableData =
                text
                .split(/\r?\n/)
                .map(
                    line =>
                    line.trim()
                )
                .filter(Boolean)
                .map(
                    line =>
                    [line]
                );

        }


        /*
           Remove empty rows.
        */

        tableData =
            tableData.filter(
                row =>
                row.some(
                    cell =>
                    String(
                        cell || ""
                    ).trim() !== ""
                )
            );


        if(!tableData.length){

            throw new Error(
                "No readable text found."
            );

        }


        /*
           ALWAYS keep the requested
           number of columns.
        */

        tableData =
            tableData.map(
                row => {

                    const newRow =
                        Array.from(
                            {
                                length:
                                count
                            },
                            (_,i) =>
                            String(
                                row[i] || ""
                            ).trim()
                        );


                    return newRow;

                }
            );


        currentColumns =
            count;


        renderTable();


        progressBar.style.width =
            "100%";


        progressText.textContent =
            "Completed!";


        resultCard.style.display =
            "block";


        progressBox.style.display =
            "none";


        showStatus(
            "Table extracted successfully.",
            "success"
        );


        resultCard.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

    }
    catch(error){

        console.error(
            "OCR ERROR:",
            error
        );


        progressBox.style.display =
            "none";


        showStatus(
            "OCR failed: " +
            (
                error.message ||
                "Please try another image."
            ),
            "error"
        );

    }
    finally{

        extractBtn.disabled =
            !selectedFile;

    }

});


/* =====================================================
   RENDER TABLE
===================================================== */

function renderTable(){

    headerRow.innerHTML = "";

    tableBody.innerHTML = "";


    if(!tableData.length){

        return;
    }


    const colCount =
        currentColumns;


    for(
        let c=0;
        c<colCount;
        c++
    ){

        const th =
            document.createElement("th");


        th.textContent =
            "Column " +
            (c + 1);


        headerRow.appendChild(th);

    }


    tableData.forEach(
    function(row,rowIndex){

        const tr =
            document.createElement("tr");


        for(
            let c=0;
            c<colCount;
            c++
        ){

            const td =
                document.createElement("td");


            td.contentEditable =
                "true";


            td.spellcheck =
                false;


            td.textContent =
                row[c] || "";


            td.addEventListener(
            "input",
            function(){

                if(
                    tableData[rowIndex]
                ){

                    tableData[rowIndex][c] =
                        td.innerText;

                }

            });


            tr.appendChild(td);

        }


        tableBody.appendChild(tr);

    });

}


/* =====================================================
   CURRENT TABLE
===================================================== */

function getTableData(){

    const rows = [];


    const headerCells =
        document.querySelectorAll(
            "#resultTable thead th"
        );


    if(headerCells.length){

        rows.push(
            Array.from(
                headerCells
            ).map(
                cell =>
                cell.innerText.trim()
            )
        );

    }


    const trs =
        document.querySelectorAll(
            "#resultTable tbody tr"
        );


    trs.forEach(function(tr){

        rows.push(
            Array.from(
                tr.querySelectorAll("td")
            ).map(
                cell =>
                cell.innerText.trim()
            )
        );

    });


    return rows;

}


/* =====================================================
   EXCEL
===================================================== */

downloadExcel.addEventListener(
"click",
function(){

    try{

        if(
            typeof XLSX ===
            "undefined"
        ){

            alert(
                "Excel library is not loaded."
            );

            return;
        }


        const data =
            getTableData();


        if(!data.length){

            alert(
                "No table data available."
            );

            return;
        }


        const worksheet =
            XLSX.utils.aoa_to_sheet(
                data
            );


        const widths = [];


        data.forEach(function(row){

            row.forEach(
            function(value,index){

                const length =
                    String(
                        value || ""
                    ).length;


                widths[index] =
                    Math.max(
                        widths[index] || 10,
                        Math.min(
                            length + 2,
                            50
                        )
                    );

            });

        });


        worksheet["!cols"] =
            widths.map(
                w => ({
                    wch:w
                })
            );


        const workbook =
            XLSX.utils.book_new();


        XLSX.utils.book_append_sheet(
            workbook,
            worksheet,
            "Image Data"
        );


        XLSX.writeFile(
            workbook,
            "Asim_Tech_Image_to_Excel.xlsx"
        );

    }
    catch(error){

        console.error(error);

        alert(
            "Excel download failed."
        );

    }

});


/* =====================================================
   CSV
===================================================== */

downloadCSV.addEventListener(
"click",
function(){

    const data =
        getTableData();


    if(!data.length){

        alert(
            "No table data available."
        );

        return;
    }


    const csv =
        data
        .map(
            row =>
            row
            .map(
                value =>
                '"' +
                String(
                    value || ""
                )
                .replace(
                    /"/g,
                    '""'
                ) +
                '"'
            )
            .join(",")
        )
        .join("\r\n");


    const blob =
        new Blob(
            [
                "\uFEFF" +
                csv
            ],
            {
                type:
                "text/csv;charset=utf-8"
            }
        );


    downloadBlob(
        blob,
        "Asim_Tech_Image_to_Excel.csv"
    );

});


/* =====================================================
   DOWNLOAD
===================================================== */

function downloadBlob(
    blob,
    filename
){

    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement("a");


    a.href = url;

    a.download = filename;

    a.style.display = "none";


    document.body.appendChild(a);

    a.click();


    setTimeout(
    function(){

        if(a.parentNode){

            a.parentNode.removeChild(a);

        }

        URL.revokeObjectURL(url);

    },
    1500
    );

}


/* =====================================================
   ADD ROW
===================================================== */

addRow.addEventListener(
"click",
function(){

    tableData.push(
        Array(
            currentColumns
        ).fill("")
    );


    renderTable();

});


/* =====================================================
   ADD COLUMN
===================================================== */

addColumn.addEventListener(
"click",
function(){

    if(!tableData.length){

        tableData.push(
            Array(
                currentColumns
            ).fill("")
        );

    }


    tableData.forEach(
        row =>
        row.push("")
    );


    currentColumns += 1;


    renderTable();

});


/* =====================================================
   COPY
===================================================== */

copyTable.addEventListener(
"click",
async function(){

    const data =
        getTableData();


    const text =
        data
        .map(
            row =>
            row.join("\t")
        )
        .join("\n");


    try{

        await navigator.clipboard.writeText(
            text
        );


        showStatus(
            "Table copied successfully.",
            "success"
        );

    }
    catch(error){

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value = text;


        document.body.appendChild(
            textarea
        );


        textarea.select();


        document.execCommand(
            "copy"
        );


        document.body.removeChild(
            textarea
        );


        showStatus(
            "Table copied.",
            "success"
        );

    }

});


/* =====================================================
   CLEAR TABLE
===================================================== */

clearTable.addEventListener(
"click",
function(){

    tableData = [];

    currentColumns = 1;

    headerRow.innerHTML = "";

    tableBody.innerHTML = "";

    resultCard.style.display =
        "none";

});


/* =====================================================
   SERVICE WORKER
===================================================== */

if(
    "serviceWorker" in navigator
){

    window.addEventListener(
    "load",
    function(){

        navigator.serviceWorker
        .register(
            "./sw.js",
            {
                updateViaCache:"none"
            }
        )
        .then(
            registration => {

                registration.update();

            }
        )
        .catch(
            error => {

                console.log(
                    "Service Worker:",
                    error
                );

            }
        );

    });

}

</script>
