<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Asim Tech - Image to Excel</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#020b18;
color:white;
}
header{
background:#010a16;
padding:15px;
border-bottom:1px solid #075080;
}
.header{
max-width:1000px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}
.logo{
font-size:25px;
font-weight:bold;
}
.logo span{color:#078dff}
.back{
color:white;
text-decoration:none;
background:#06304b;
padding:10px 15px;
border-radius:12px;
}
.container{
max-width:950px;
margin:auto;
padding:35px 15px;
}
.hero{text-align:center}
.hero h1{
font-size:50px;
margin:10px 0;
}
.hero h1 span{color:#078dff}
.hero p{color:#91adc0;font-size:18px}
.card{
background:#032236;
border:1px solid #075080;
border-radius:20px;
padding:25px;
margin-top:25px;
}
.upload{
border:3px dashed #086292;
border-radius:20px;
padding:40px 15px;
text-align:center;
}
input[type=file]{display:none}
.file{
display:inline-block;
background:#078dff;
padding:16px 25px;
border-radius:14px;
font-weight:bold;
cursor:pointer;
}
.preview{
display:none;
margin-top:20px;
}
.preview img{
max-width:100%;
max-height:350px;
border-radius:15px;
}
select,button{
width:100%;
height:55px;
margin-top:15px;
border-radius:13px;
font-size:17px;
}
select{
background:#062b40;
color:white;
border:1px solid #176789;
padding:0 10px;
}
button{
border:0;
background:#078dff;
color:white;
font-weight:bold;
cursor:pointer;
}
button:disabled{opacity:.4}
.clear{background:#e9002c}
.progress{
display:none;
margin-top:20px;
}
.bar{
height:10px;
background:#078dff;
width:0%;
border-radius:20px;
}
.status{
margin-top:15px;
text-align:center;
font-weight:bold;
}
.table{
overflow:auto;
margin-top:20px;
background:white;
color:black;
}
table{
border-collapse:collapse;
width:100%;
min-width:600px;
}
th,td{
border:1px solid #aaa;
padding:12px;
}
th{
background:#d8f0fc;
}
td{background:white}
.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}
.green{background:#00b848}
.orange{background:#ff8500}
.red{background:#e9002c}

@media(max-width:600px){
.hero h1{font-size:42px}
.actions{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="header">
<div class="logo">ASIM<span>TECH</span></div>
<a class="back" href="../">← Asim Tech</a>
</div>
</header>

<div class="container">

<section class="hero">
<h1>Image <span>→ Excel</span></h1>
<p>বাংলা + English Image OCR থেকে editable Excel</p>
</section>

<section class="card">

<div class="upload">

<h2>📷 Upload Image</h2>

<p>
বাংলা / English table বা list-এর ছবি নির্বাচন করুন
</p>

<label class="file" for="imageInput">
📁 Choose Image
</label>

<input id="imageInput" type="file" accept="image/*">

<div class="preview" id="preview">
<img id="previewImage">
<p id="fileName"></p>
</div>

</div>

<select id="language">
<option value="eng">English</option>
<option value="ben">বাংলা</option>
<option value="eng+ben">English + বাংলা</option>
</select>

<select id="columns">
<option value="auto">Auto Detect Columns</option>
<option value="1">1 Column</option>
<option value="2">2 Columns</option>
<option value="3">3 Columns</option>
<option value="4">4 Columns</option>
<option value="5">5 Columns</option>
<option value="6">6 Columns</option>
</select>

<button id="extract" disabled>
🔍 Extract Table
</button>

<button class="clear" id="clear">
✕ Clear
</button>

<div class="progress" id="progress">
<p id="progressText">OCR চলছে...</p>
<div style="background:#092538;border-radius:20px">
<div class="bar" id="bar"></div>
</div>
</div>

<div class="status" id="status"></div>

</section>


<section class="card" id="result" style="display:none">

<h2>📊 Extracted Table</h2>

<div class="table">
<table id="table">
<thead id="thead"></thead>
<tbody id="tbody"></tbody>
</table>
</div>

<div class="actions">

<button class="green" id="excel">
📥 Download Excel
</button>

<button id="csv">
📄 Download CSV
</button>

<button class="orange" id="addRow">
＋ Add Row
</button>

<button class="orange" id="addCol">
＋ Add Column
</button>

<button id="copy">
📋 Copy Table
</button>

<button class="red" id="delete">
🗑️ Clear Table
</button>

</div>

</section>

</div>


<script>

let file=null;
let data=[];
let colCount=1;

const imageInput=document.getElementById("imageInput");
const preview=document.getElementById("preview");
const previewImage=document.getElementById("previewImage");
const fileName=document.getElementById("fileName");
const extract=document.getElementById("extract");
const status=document.getElementById("status");
const progress=document.getElementById("progress");
const bar=document.getElementById("bar");
const progressText=document.getElementById("progressText");
const result=document.getElementById("result");
const thead=document.getElementById("thead");
const tbody=document.getElementById("tbody");


function message(text){
status.textContent=text;
}


imageInput.onchange=function(e){

file=e.target.files[0];

if(!file)return;

previewImage.src=URL.createObjectURL(file);
fileName.textContent=file.name;
preview.style.display="block";
extract.disabled=false;

message("Image selected.");

};


document.getElementById("clear").onclick=function(){

file=null;
imageInput.value="";
preview.style.display="none";
extract.disabled=true;
result.style.display="none";
data=[];
message("");

};


function makeRows(words){

let rows=[];
let tolerance=20;

words=words
.filter(w=>w.text && w.bbox)
.sort((a,b)=>
((a.bbox.y0+a.bbox.y1)/2)-
((b.bbox.y0+b.bbox.y1)/2)
);

for(let word of words){

let y=(word.bbox.y0+word.bbox.y1)/2;

let row=rows.find(r=>
Math.abs(r.y-y)<=tolerance
);

if(!row){

row={y:y,words:[]};
rows.push(row);

}

row.words.push(word);

}

rows.sort((a,b)=>a.y-b.y);

rows.forEach(r=>
r.words.sort((a,b)=>a.bbox.x0-b.bbox.x0)
);

return rows;

}


function blocks(row){

let result=[];
let gap=20;

for(let word of row.words){

if(!result.length){

result.push({
text:word.text,
x0:word.bbox.x0,
x1:word.bbox.x1
});

continue;

}

let last=result[result.length-1];

if(word.bbox.x0-last.x1<gap){

last.text+=" "+word.text;
last.x1=word.bbox.x1;

}else{

result.push({
text:word.text,
x0:word.bbox.x0,
x1:word.bbox.x1
});

}

}

return result;

}


function buildTable(rows,n){

if(n===1){

return rows.map(r=>[
blocks(r).map(b=>b.text).join(" ")
]);

}


let all=[];

rows.forEach(r=>{
blocks(r).forEach(b=>all.push(b));
});


if(!all.length)return[];


let min=Math.min(...all.map(b=>b.x0));
let max=Math.max(...all.map(b=>b.x1));


let centers=[];

for(let i=0;i<n;i++){

centers.push(
min+(max-min)*(i+.5)/n
);

}


let output=[];


rows.forEach(row=>{

let cells=Array.from(
{length:n},
()=>[]
);

blocks(row).forEach(block=>{

let center=(block.x0+block.x1)/2;

let best=0;
let distance=Infinity;

centers.forEach((x,i)=>{

let d=Math.abs(center-x);

if(d<distance){

distance=d;
best=i;

}

});

cells[best].push(block.text);

});


output.push(
cells.map(x=>x.join(" "))
);

});


return output;

}


extract.onclick=async function(){

if(!file)return;

try{

extract.disabled=true;
progress.style.display="block";
bar.style.width="5%";
progressText.textContent="Preparing OCR...";


const resultOCR=
await Tesseract.recognize(
file,
document.getElementById("language").value,
{
logger:function(info){

if(info.status==="recognizing text"){

let p=Math.round(info.progress*100);

bar.style.width=
(10+p*.85)+"%";

progressText.textContent=
"OCR চলছে... "+p+"%";

}

}
}
);


bar.style.width="95%";
progressText.textContent="Table তৈরি হচ্ছে...";


let rows=makeRows(
resultOCR.data.words || []
);


let selected=
document.getElementById("columns").value;


if(selected==="auto"){

let counts=rows.map(r=>blocks(r).length);

colCount=counts.length
?Math.max(...counts)
:1;

colCount=Math.min(colCount,6);

}else{

colCount=parseInt(selected);

}


if(!colCount || colCount<1)colCount=1;


data=buildTable(
rows,
colCount
);


data=data.filter(row=>
row.some(x=>x.trim()!=="")
);


if(!data.length){

let text=resultOCR.data.text||"";

data=text
.split(/\r?\n/)
.filter(x=>x.trim())
.map(x=>[x]);

colCount=1;

}


data=data.map(row=>{

let r=[];

for(let i=0;i<colCount;i++){

r.push(row[i]||"");

}

return r;

});


render();

result.style.display="block";

bar.style.width="100%";

progressText.textContent="Completed";

message("Table extracted successfully.");

setTimeout(()=>{
progress.style.display="none";
},500);

result.scrollIntoView({
behavior:"smooth"
});

}catch(e){

console.error(e);

progress.style.display="none";

message("OCR Error: "+e.message);

}finally{

extract.disabled=!file;

}

};


function render(){

thead.innerHTML="";
tbody.innerHTML="";


let head=document.createElement("tr");

for(let i=0;i<colCount;i++){

let th=document.createElement("th");

th.textContent="Column "+(i+1);

head.appendChild(th);

}

thead.appendChild(head);


data.forEach((row,r)=>{

let tr=document.createElement("tr");

row.forEach((value,c)=>{

let td=document.createElement("td");

td.contentEditable="true";

td.textContent=value;

td.oninput=()=>{
data[r][c]=td.innerText;
};

tr.appendChild(td);

});

tbody.appendChild(tr);

});

}


function currentData(){

let result=[];

result.push(
Array.from(
thead.querySelectorAll("th")
).map(x=>x.innerText)
);

tbody.querySelectorAll("tr").forEach(tr=>{

result.push(
Array.from(
tr.querySelectorAll("td")
).map(x=>x.innerText)
);

});

return result;

}


document.getElementById("excel").onclick=function(){

let d=currentData();

let ws=XLSX.utils.aoa_to_sheet(d);

let wb=XLSX.utils.book_new();

XLSX.utils.book_append_sheet(
wb,
ws,
"Image Data"
);

XLSX.writeFile(
wb,
"Asim_Tech_Image_to_Excel.xlsx"
);

};


document.getElementById("csv").onclick=function(){

let d=currentData();

let csv=d.map(row=>
row.map(x=>
'"'+x.replace(/"/g,'""')+'"'
).join(",")
).join("\r\n");

let blob=new Blob(
["\uFEFF"+csv],
{type:"text/csv;charset=utf-8"}
);

let a=document.createElement("a");

a.href=URL.createObjectURL(blob);
a.download="Asim_Tech_Image_to_Excel.csv";

a.click();

};


document.getElementById("addRow").onclick=function(){

data.push(
Array(colCount).fill("")
);

render();

};


document.getElementById("addCol").onclick=function(){

colCount++;

data.forEach(row=>row.push(""));

render();

};


document.getElementById("copy").onclick=async function(){

let text=currentData()
.map(row=>row.join("\t"))
.join("\n");

await navigator.clipboard.writeText(text);

message("Table copied.");

};


document.getElementById("delete").onclick=function(){

data=[];
result.style.display="none";

};


</script>

</body>
</html>
