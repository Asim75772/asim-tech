<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quiz / MCQ | ASIM TECH StudentHub</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#14233a;font-family:Arial,"Noto Sans Bengali",sans-serif;line-height:1.5}
.top{background:#0b1b33;color:#fff;padding:18px 20px;text-align:center}.top h1{margin:0;font-size:24px}.top p{margin:3px 0 0;color:#bcd0e2;font-size:12px}
.wrap{width:min(900px,calc(100% - 24px));margin:20px auto}.card{background:#fff;border:1px solid #e2e9f0;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 5px 18px #163c6010}
h2{margin:0 0 12px;color:#0879b9;font-size:22px}.btn{display:inline-block;background:#087fc5;color:#fff;border:0;border-radius:9px;padding:9px 14px;text-decoration:none;cursor:pointer;margin:4px}.back{color:#087fc5;text-decoration:none;font-size:13px}
input,textarea,select{width:100%;padding:11px;border:1px solid #d7e0e8;border-radius:9px;margin:6px 0 10px;font-size:14px}textarea{min-height:180px}
.result{font-size:28px;font-weight:800;text-align:center;padding:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}}
.q{padding:13px 0;border-bottom:1px solid #e5ebf0}.q:last-child{border:0}.options label{display:block;margin:6px 0}.status{text-align:center;font-size:18px;font-weight:700}
</style></head><body><header class="top"><h1>ASIM TECH • StudentHub</h1><p>Quiz / MCQ</p></header><main class="wrap"><a class="back" href="index.html">← StudentHub Home</a>
<div class="card"><h2>Quiz / MCQ</h2>
<p>Class 5-এর জন্য ছোট practice quiz। উত্তর নির্বাচন করে <b>Submit Quiz</b> চাপুন।</p>
<div class="q"><b>1. 4582-এর 5-এর স্থানীয় মান কত?</b><div class="options">
<label><input type="radio" name="q1" value="a"> A) 5</label><label><input type="radio" name="q1" value="b"> B) 50</label><label><input type="radio" name="q1" value="c"> C) 500</label><label><input type="radio" name="q1" value="d"> D) 5000</label></div></div>
<div class="q"><b>2. 125 × 4 = কত?</b><div class="options">
<label><input type="radio" name="q2" value="a"> A) 400</label><label><input type="radio" name="q2" value="b"> B) 500</label><label><input type="radio" name="q2" value="c"> C) 525</label><label><input type="radio" name="q2" value="d"> D) 600</label></div></div>
<div class="q"><b>3. 2/7 + 3/7 = কত?</b><div class="options">
<label><input type="radio" name="q3" value="a"> A) 5/7</label><label><input type="radio" name="q3" value="b"> B) 5/14</label><label><input type="radio" name="q3" value="c"> C) 6/7</label><label><input type="radio" name="q3" value="d"> D) 1/7</label></div></div>
<button class="btn" onclick="submitQuiz()">Submit Quiz</button><div id="result" class="result"></div></div>
<script>
function submitQuiz(){let ans=['c','b','a'],score=0;ans.forEach((x,i)=>{let e=document.querySelector('input[name=q'+(i+1)+']:checked');if(e&&e.value===x)score++;});document.getElementById('result').textContent='Score: '+score+' / 3';}
</script>
</main></body></html>
