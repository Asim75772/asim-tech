name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir -p android-project

          unzip -o \
            app-builder/madhu-music-world-android-project.zip \
            -d android-project

      - name: Find Android project
        run: |
          echo "Searching for build.gradle files..."
          find android-project -name "build.gradle" -o -name "build.gradle.kts"

      - name: Build APK
        run: |
          PROJECT_DIR=$(find android-project \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            | head -1 \
            | xargs -r dirname)

          echo "Project directory: $PROJECT_DIR"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          cd "$PROJECT_DIR"

          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find android-project -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
