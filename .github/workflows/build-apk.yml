name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Find Android project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -type f -name "*android-project*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Android project ZIP not found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

          echo "Extracted project files:"
          find android-project -maxdepth 4 -type f | sort

      - name: Find Gradle project
        shell: bash
        run: |
          SETTINGS=$(find android-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found."
            find android-project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Gradle project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Gradle
        shell: bash
        run: |
          gradle --version

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Find APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found."
            find "$PROJECT_DIR" -maxdepth 8 -type f | sort
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/Asim-Tech-App.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Asim-Tech-APK
          path: Asim-Tech-App.apk
