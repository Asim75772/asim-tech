name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -o app-builder/madhu-music-world-android-project.zip -d android-project

      - name: Find Android project
        run: |
          find android-project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \
            -o -name "build.gradle" -o -name "build.gradle.kts" \
            -o -name "gradlew" \) -print

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(find android-project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          GRADLEW=$(find "$PROJECT_DIR" -type f -name gradlew -print -quit)

          if [ -n "$GRADLEW" ]; then
            chmod +x "$GRADLEW"
            echo "Gradle wrapper ready: $GRADLEW"
          else
            echo "No gradlew found; system Gradle will be used."
          fi

      - name: Build APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        run: |
          find android-project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
