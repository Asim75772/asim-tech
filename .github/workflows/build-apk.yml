name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -type f -name "*android-project*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Android project ZIP not found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

          echo "Extracted files:"
          find android-project -maxdepth 3 -type f | head -100

      - name: Find Gradle project
        shell: bash
        run: |
          GRADLEW=$(find android-project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found."
            echo "Searching project files:"
            find android-project -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Gradle wrapper found:"
          echo "$GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        shell: bash
        run: |
          chmod +x "$GRADLEW"
          ls -l "$GRADLEW"

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/Asim-Tech-App.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Asim-Tech-APK
          path: Asim-Tech-App.apk
