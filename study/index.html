<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f5f7fb;
  color:#172033;
}
header{
  background:#102a56;
  color:white;
  padding:18px 15px;
  text-align:center;
}
header h1{font-size:24px}
header p{font-size:13px;margin-top:5px;opacity:.85}

.container{
  max-width:950px;
  margin:auto;
  padding:20px 14px 50px;
}

h2{font-size:20px;margin-bottom:12px}
.section{margin-bottom:25px}

.class-list,.subject-list,.chapter-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:10px;
}

button{
  border:0;
  cursor:pointer;
  font-family:inherit;
}

.class-btn,.subject-btn,.chapter-btn{
  background:white;
  border:1px solid #dbe2ee;
  border-radius:12px;
  padding:15px 10px;
  font-size:15px;
  box-shadow:0 2px 8px #00000008;
}

.class-btn.active,.subject-btn.active{
  background:#1769e0;
  color:white;
  border-color:#1769e0;
}

.subject-btn{
  min-height:90px;
  font-size:16px;
}
.subject-btn span{
  display:block;
  font-size:27px;
  margin-bottom:7px;
}

.chapter-btn{
  text-align:left;
  padding:16px;
}
.chapter-btn strong{
  display:block;
  margin-bottom:5px;
}
.chapter-btn small{
  color:#68758a;
}
.chapter-btn:hover{background:#eef5ff}

.study-box{
  display:none;
  background:white;
  border-radius:16px;
  padding:20px;
  margin-top:20px;
  box-shadow:0 4px 20px #0000000d;
}
.study-box.show{display:block}

.back{
  background:#eef2f7;
  padding:8px 14px;
  border-radius:8px;
  margin-bottom:15px;
}

.study-box h2{color:#123d78}
.study-box h3{
  margin:20px 0 9px;
  font-size:17px;
}
.summary{
  line-height:1.8;
  color:#39465b;
}
.points{
  padding-left:20px;
  line-height:1.8;
}
.note{
  background:#fff8dc;
  padding:14px;
  border-radius:10px;
  line-height:1.7;
}

.quiz{
  margin-top:10px;
}
.question{
  border:1px solid #e0e5ed;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
}
.question p{
  font-weight:bold;
  margin-bottom:10px;
}
.option{
  display:block;
  background:#f7f9fc;
  padding:9px;
  border-radius:7px;
  margin:6px 0;
}
.option input{margin-right:7px}

.quiz-btn{
  background:#1769e0;
  color:white;
  padding:12px 20px;
  border-radius:9px;
  font-size:15px;
}
.result{
  margin-top:15px;
  padding:14px;
  background:#eaf7ee;
  border-radius:10px;
  font-weight:bold;
  display:none;
}

footer{
  text-align:center;
  padding:20px;
  background:#102a56;
  color:white;
  font-size:13px;
}

@media(max-width:600px){
  header h1{font-size:21px}
  .container{padding:16px 10px 40px}
  .class-list{grid-template-columns:repeat(4,1fr)}
  .class-btn{padding:12px 5px;font-size:13px}
}
</style>
</head>

<body>

<header>

</header>

  </section>

    <div class="result" id="result"></div>
  </section>

</main>

let currentClass="5";
let currentSubject="বাংলা";
let currentChapter=null;
let quizData=[];

const $=id=>document.getElementById(id);

function renderClasses(){

  $("classes").innerHTML="";

  Object.keys(DATA).forEach(cls=>{

    const b=document.createElement("button");
    b.className="class-btn "+(cls===currentClass?"active":"");
    b.textContent="Class "+cls;

    b.onclick=()=>{
      currentClass=cls;

      const subjects=DATA[cls];
      currentSubject=Object.keys(subjects)[0];

      renderClasses();
      renderSubjects();
      renderChapters();
      closeStudy();
    };

    $("classes").appendChild(b);

  });
}


function renderSubjects(){

  $("subjects").innerHTML="";

  Object.entries(DATA[currentClass]).forEach(
    ([name,subject])=>{

      const b=document.createElement("button");

      b.className=
        "subject-btn "+
        (name===currentSubject?"active":"");

      b.innerHTML=
        `<span>${subject.icon}</span>${name}`;

      b.onclick=()=>{
        currentSubject=name;
        renderSubjects();
        renderChapters();
        closeStudy();
      };

      $("subjects").appendChild(b);

    }
  );
}


function renderChapters(){

  const subject=
    DATA[currentClass][currentSubject];

  $("chapterTitle").textContent=
    "📖 "+currentSubject+" — Chapters";

  $("chapters").innerHTML="";

  subject.chapters.forEach(
    (chapter,index)=>{

      const b=document.createElement("button");
      b.className="chapter-btn";

      b.innerHTML=
        `<strong>${index+1}. ${chapter.title}</strong>
         <small>Study + Important Points + MCQ</small>`;

      b.onclick=()=>openChapter(chapter);

      $("chapters").appendChild(b);

    }
  );
}


function openChapter(chapter){

  currentChapter=chapter;

  $("studyTitle").textContent=
    chapter.title;

  $("summary").textContent=
    chapter.summary;

  $("points").innerHTML=
    chapter.points.map(
      p=>`<li>${p}</li>`
    ).join("");

  $("note").textContent=
    chapter.note;

  quizData=
    [...chapter.mcq]
      .sort(()=>Math.random()-.5);

  renderQuiz();

  $("result").style.display="none";

  $("studyBox").classList.add("show");

  $("studyBox").scrollIntoView({
    behavior:"smooth"
  });
}


function renderQuiz(){

  $("quiz").innerHTML="";

  quizData.forEach((q,i)=>{

    const box=document.createElement("div");
    box.className="question";

    box.innerHTML=
      `<p>${i+1}. ${q.q}</p>`+
      q.options.map(
        (op,j)=>`
        <label class="option">
          <input type="radio"
                 name="q${i}"
                 value="${j}">
          ${String.fromCharCode(65+j)}. ${op}
        </label>
        `
      ).join("");

    $("quiz").appendChild(box);

  });
}


function submitQuiz(){

  if(!quizData.length)return;

  let score=0;

  quizData.forEach((q,i)=>{

    const selected=
      document.querySelector(
        `input[name="q${i}"]:checked`
      );

    if(
      selected &&
      Number(selected.value)===q.answer
    ){
      score++;
    }

  });

  const percent=
    Math.round(score/quizData.length*100);

  $("result").style.display="block";

  $("result").innerHTML=
    `🎯 আপনার Score: ${score}/${quizData.length}
     <br>📊 ${percent}%`;

}


function closeStudy(){

  $("studyBox").classList.remove("show");
  currentChapter=null;

}

renderClasses();
renderSubjects();
renderChapters();

</script>
