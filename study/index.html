<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ASIM TECH STUDY</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#060d19;
  --bg2:#0a1424;
  --card:#0d1b2e;
  --card2:#11243c;
  --line:rgba(255,255,255,.09);
  --text:#f5f8ff;
  --muted:#98a8bf;
  --blue:#4d8dff;
  --purple:#7566ff;
  --cyan:#42d9ff;
  --green:#39d99a;
  --gold:#ffc857;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    Arial,
    "Noto Sans Bengali",
    sans-serif;
  background:
    radial-gradient(
      circle at 5% 0%,
      rgba(55,110,190,.28),
      transparent 28%
    ),
    radial-gradient(
      circle at 95% 5%,
      rgba(105,75,190,.22),
      transparent 28%
    ),
    linear-gradient(
      180deg,
      var(--bg),
      var(--bg2)
    );
  color:var(--text);
  min-height:100vh;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  padding:15px;
  background:rgba(6,13,25,.82);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:white;
  font-weight:800;
  letter-spacing:.5px;
}

.logo-icon{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--purple)
    );
  box-shadow:
    0 8px 25px rgba(77,141,255,.25);
  font-size:21px;
}

.header-badge{
  color:#aebdd2;
  font-size:12px;
  border:1px solid var(--line);
  padding:7px 10px;
  border-radius:20px;
}

/* HERO */

.hero{
  max-width:1100px;
  margin:auto;
  padding:55px 15px 35px;
  display:grid;
  grid-template-columns:1.4fr .8fr;
  gap:30px;
  align-items:center;
}

.hero h1{
  font-size:clamp(32px,5vw,55px);
  line-height:1.08;
  letter-spacing:-1px;
}

.hero h1 span{
  background:
    linear-gradient(
      90deg,
      var(--blue),
      var(--cyan),
      #9b8cff
    );
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  margin-top:16px;
  max-width:650px;
  color:var(--muted);
  line-height:1.8;
  font-size:15px;
}

.hero-card{
  min-height:240px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px solid var(--line);
  border-radius:25px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.07),
      rgba(255,255,255,.025)
    );
  box-shadow:
    0 25px 70px rgba(0,0,0,.28);
  position:relative;
  overflow:hidden;
}

.hero-card:before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  background:rgba(77,141,255,.2);
  filter:blur(70px);
}

.hero-book{
  font-size:65px;
  position:relative;
  margin-bottom:12px;
}

.hero-card h2{
  position:relative;
  font-size:21px;
}

.hero-card p{
  position:relative;
  margin-top:7px;
}

/* MAIN */

.container{
  max-width:1100px;
  margin:auto;
  padding:10px 15px 70px;
}

.section{
  margin-bottom:32px;
}

.section-head{
  margin-bottom:15px;
}

.section-head h2{
  font-size:21px;
}

.section-head p{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

/* CLASS */

.class-list{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(100px,1fr));
  gap:10px;
}

.class-btn{
  border:1px solid var(--line);
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.06),
      rgba(255,255,255,.025)
    );
  color:var(--text);
  padding:14px 8px;
  border-radius:13px;
  cursor:pointer;
  font-size:14px;
  transition:.25s;
}

.class-btn:hover{
  transform:translateY(-3px);
  border-color:rgba(77,141,255,.5);
}

.class-btn.active{
  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--purple)
    );
  border-color:transparent;
  box-shadow:
    0 10px 30px rgba(77,141,255,.22);
}

/* SUBJECT */

.subject-list{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
}

.subject-btn{
  min-height:125px;
  border:1px solid var(--line);
  border-radius:18px;
  background:
    linear-gradient(
      145deg,
      var(--card),
      #091525
    );
  color:white;
  cursor:pointer;
  transition:.25s;
  box-shadow:
    0 10px 30px rgba(0,0,0,.16);
}

.subject-btn:hover{
  transform:translateY(-5px);
  border-color:rgba(77,141,255,.5);
}

.subject-btn.active{
  border-color:var(--blue);
  background:
    linear-gradient(
      145deg,
      rgba(77,141,255,.20),
      rgba(117,102,255,.13)
    );
}

.subject-icon{
  font-size:34px;
  margin-bottom:10px;
}

.subject-name{
  font-size:16px;
  font-weight:bold;
}

.subject-count{
  color:var(--muted);
  font-size:12px;
  margin-top:6px;
}

/* RECENT */

.recent-box{
  display:none;
  align-items:center;
  gap:14px;
  padding:14px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
  border-radius:14px;
}

.recent-box.show{
  display:flex;
}

.recent-icon{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:rgba(77,141,255,.13);
  font-size:21px;
}

.recent-info{
  flex:1;
}

.recent-info small{
  display:block;
  color:var(--muted);
  margin-bottom:4px;
}

.recent-info strong{
  font-size:14px;
}

.recent-btn{
  background:var(--blue);
  color:white;
  padding:9px 13px;
  border-radius:8px;
}

/* CHAPTER */

.chapter-list{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(260px,1fr));
  gap:13px;
}

.chapter-btn{
  position:relative;
  overflow:hidden;
  text-align:left;
  padding:18px;
  min-height:105px;
  border:1px solid var(--line);
  border-radius:16px;
  background:
    linear-gradient(
      145deg,
      var(--card),
      #091524
    );
  color:white;
  cursor:pointer;
  transition:.25s;
}

.chapter-btn:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;
  background:
    linear-gradient(
      var(--blue),
      var(--purple)
    );
}

.chapter-btn:hover{
  transform:translateY(-4px);
  border-color:rgba(77,141,255,.4);
  box-shadow:
    0 15px 35px rgba(0,0,0,.2);
}

.chapter-number{
  color:#79aaff;
  font-size:11px;
  margin-bottom:7px;
  text-transform:uppercase;
}

.chapter-btn strong{
  display:block;
  font-size:16px;
  margin-bottom:7px;
}

.chapter-btn small{
  color:var(--muted);
  line-height:1.5;
}

/* STUDY PANEL */

.study-box{
  display:none;
  margin-top:25px;
  padding:25px;
  border:1px solid var(--line);
  border-radius:23px;
  background:
    linear-gradient(
      145deg,
      rgba(17,36,61,.98),
      rgba(7,17,30,.98)
    );
  box-shadow:
    0 30px 80px rgba(0,0,0,.3);
}

.study-box.show{
  display:block;
  animation:up .35s ease;
}

@keyframes up{
  from{
    opacity:0;
    transform:translateY(18px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.study-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
  margin-bottom:20px;
}

.study-label{
  color:#7eaaff;
  font-size:12px;
  margin-bottom:7px;
}

.study-title{
  font-size:28px;
}

.close-btn{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  color:white;
  padding:9px 12px;
  border-radius:9px;
  cursor:pointer;
}

.study-section{
  margin-top:22px;
}

.study-section h3{
  font-size:17px;
  margin-bottom:10px;
}

.summary{
  color:#c4cede;
  line-height:1.9;
}

.points{
  padding-left:22px;
  color:#c4cede;
  line-height:1.9;
}

.points li{
  margin-bottom:4px;
}

.note{
  padding:16px;
  border-radius:13px;
  line-height:1.8;
  color:#f4df9c;
  background:
    linear-gradient(
      135deg,
      rgba(255,200,87,.12),
      rgba(255,200,87,.035)
    );
  border:1px solid rgba(255,200,87,.18);
}

/* QUIZ */

.quiz-question{
  margin-bottom:15px;
  padding:17px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.025);
}

.quiz-question p{
  font-weight:bold;
  line-height:1.65;
  margin-bottom:12px;
}

.option{
  display:block;
  padding:10px 12px;
  margin:7px 0;
  border-radius:9px;
  background:rgba(255,255,255,.035);
  color:#c9d4e5;
  cursor:pointer;
  border:1px solid transparent;
  transition:.2s;
}

.option:hover{
  background:rgba(77,141,255,.09);
  border-color:rgba(77,141,255,.25);
}

.option input{
  margin-right:8px;
  accent-color:var(--blue);
}

.explanation{
  display:none;
  margin-top:10px;
  padding:10px;
  border-radius:8px;
  color:#9ee8c8;
  background:rgba(57,217,154,.07);
  font-size:13px;
  line-height:1.6;
}

.quiz-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:17px;
}

.quiz-btn{
  border:0;
  padding:12px 20px;
  border-radius:10px;
  color:white;
  cursor:pointer;
  font-weight:bold;
  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--purple)
    );
  box-shadow:
    0 8px 25px rgba(77,141,255,.2);
}

.quiz-btn.secondary{
  background:rgba(255,255,255,.07);
  border:1px solid var(--line);
  box-shadow:none;
}

.result{
  display:none;
  margin-top:17px;
  padding:17px;
  border-radius:13px;
  color:#8cf0c4;
  background:rgba(57,217,154,.08);
  border:1px solid rgba(57,217,154,.18);
  line-height:1.8;
}

/* EMPTY */

.empty{
  padding:25px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:14px;
}

/* FOOTER */

footer{
  text-align:center;
  padding:30px 15px;
  background:#040a13;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:13px;
}

footer strong{
  color:white;
  display:block;
  margin-bottom:5px;
}

/* MOBILE */

@media(max-width:700px){

  .header-badge{
    display:none;
  }

  .hero{
    grid-template-columns:1fr;
    padding-top:35px;
  }

  .hero-card{
    min-height:180px;
  }

  .hero-book{
    font-size:48px;
  }

  .class-list{
    grid-template-columns:
      repeat(4,1fr);
  }

  .class-btn{
    font-size:12px;
    padding:12px 4px;
  }

  .subject-list{
    grid-template-columns:
      repeat(2,1fr);
  }

  .chapter-list{
    grid-template-columns:1fr;
  }

  .study-box{
    padding:18px;
  }

  .study-top{
    flex-direction:column;
  }

  .study-title{
    font-size:23px;
  }

  .close-btn{
    align-self:flex-end;
  }

  .recent-box{
    flex-wrap:wrap;
  }

  .recent-btn{
    width:100%;
  }
}
</style>

/* =================================================
   RENDER CLASSES
================================================= */

function renderClasses(){

  const box=document.getElementById("classes");

  box.innerHTML="";

  Object.keys(DATA).forEach(cls=>{

    const btn=document.createElement("button");

    btn.className=
      "class-btn "+
      (cls===currentClass?"active":"");

    btn.textContent="Class "+cls;

    btn.onclick=()=>{

      currentClass=cls;

      const names=
        Object.keys(DATA[cls]);

      currentSubject=
        names[0] || "";

      currentChapter=null;

      renderClasses();
      renderSubjects();
      renderChapters();
      closeStudy();

    };

    box.appendChild(btn);

  });

}


/* =================================================
   RENDER SUBJECTS
================================================= */

function renderSubjects(){

  const box=document.getElementById("subjects");

  box.innerHTML="";

  const subjects=
    DATA[currentClass] || {};

  const names=
    Object.keys(subjects);

  document.getElementById(
    "subjectDescription"
  ).textContent=
    "Class "+currentClass+
    " • "+names.length+
    "টি Subject available";

  names.forEach(name=>{

    const subject=subjects[name];

    const btn=document.createElement("button");

    btn.className=
      "subject-btn "+
      (name===currentSubject?"active":"");

    btn.innerHTML=`

      <div class="subject-icon">
        ${subject.icon}
      </div>

      <div class="subject-name">
        ${name}
      </div>

      <div class="subject-count">
        ${subject.chapters.length} Chapters
      </div>

    `;

    btn.onclick=()=>{

      currentSubject=name;

      renderSubjects();
      renderChapters();
      closeStudy();

    };

    box.appendChild(btn);

  });

}


/* =================================================
   RENDER CHAPTERS
================================================= */

function renderChapters(){

  const box=document.getElementById("chapters");

  box.innerHTML="";

  const subject=
    DATA[currentClass]?.[currentSubject];

  if(!subject){

    box.innerHTML=
      `<div class="empty">
        এই Subject-এর content শীঘ্রই আসছে।
       </div>`;

    return;

  }

  document.getElementById(
    "chapterTitle"
  ).textContent=
    "📖 "+currentSubject+" — Chapters";

  document.getElementById(
    "chapterDescription"
  ).textContent=
    subject.chapters.length+
    "টি Chapter • Study + MCQ";

  subject.chapters.forEach(
    (chapter,index)=>{

      const btn=document.createElement("button");

      btn.className="chapter-btn";

      btn.innerHTML=`

        <div class="chapter-number">
          CHAPTER ${index+1}
        </div>

        <strong>
          ${chapter.title}
        </strong>

        <small>
          📖 Study
          &nbsp;•&nbsp;
          ⭐ Important Points
          &nbsp;•&nbsp;
          🧠 MCQ
        </small>

      `;

      btn.onclick=()=>openChapter(chapter);

      box.appendChild(btn);

    }
  );

}


/* =================================================
   OPEN CHAPTER
================================================= */

function openChapter(chapter){

  currentChapter=chapter;

  quizSubmitted=false;

  document.getElementById(
    "studyLabel"
  ).textContent=
    currentSubject+
    " • Class "+
    currentClass;

  document.getElementById(
    "studyTitle"
  ).textContent=
    chapter.title;

  document.getElementById(
    "summary"
  ).textContent=
    chapter.summary;

  document.getElementById(
    "points"
  ).innerHTML=
    chapter.points
      .map(p=>`<li>${p}</li>`)
      .join("");

  document.getElementById(
    "note"
  ).textContent=
    chapter.note;

  quizData=
    [...chapter.mcq]
      .sort(
        ()=>Math.random()-.5
      );

  renderQuiz();

  document.getElementById(
    "result"
  ).style.display="none";

  document.getElementById(
    "studyBox"
  ).classList.add("show");

  saveRecent(chapter);

  document.getElementById(
    "studyBox"
  ).scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}


/* =================================================
   QUIZ
================================================= */

function renderQuiz(){

  const box=
    document.getElementById("quiz");

  box.innerHTML="";

  quizData.forEach((q,i)=>{

    const div=
      document.createElement("div");

    div.className=
      "quiz-question";

    div.innerHTML=`

      <p>
        ${i+1}. ${q.q}
      </p>

      ${
        q.options.map(
          (op,j)=>`

          <label class="option">

            <input
              type="radio"
              name="quiz${i}"
              value="${j}"
            >

            ${String.fromCharCode(65+j)}.
            ${op}

          </label>

        `
        ).join("")
      }

      <div
        class="explanation"
        id="exp${i}">
      </div>

    `;

    box.appendChild(div);

  });

}


/* =================================================
   SUBMIT QUIZ
================================================= */

function submitQuiz(){

  if(quizSubmitted){

    return;

  }

  let score=0;

  quizData.forEach((q,i)=>{

    const selected=
      document.querySelector(
        `input[name="quiz${i}"]:checked`
      );

    const explanation=
      document.getElementById(
        "exp"+i
      );

    if(
      selected &&
      Number(selected.value)===q.answer
    ){

      score++;

    }

    document.querySelectorAll(
      `input[name="quiz${i}"]`
    ).forEach(input=>{

      input.disabled=true;

      const label=
        input.parentElement;

      if(
        Number(input.value)===q.answer
      ){

        label.style.borderColor=
          "rgba(57,217,154,.45)";

        label.style.background=
          "rgba(57,217,154,.08)";

      }

      if(
        selected &&
        input===selected &&
        Number(input.value)!==q.answer
      ){

        label.style.borderColor=
          "rgba(255,90,90,.45)";

        label.style.background=
          "rgba(255,90,90,.08)";

      }

    });

    explanation.style.display="block";

    explanation.textContent=
      "💡 "+
      (
        q.explanation ||
        "সঠিক উত্তরটি দেখে বিষয়টি আবার পড়ুন।"
      );

  });

  quizSubmitted=true;

  const percent=
    Math.round(
      score/quizData.length*100
    );

  let message="";

  if(percent===100){

    message="🎉 অসাধারণ! Perfect Score!";

  }else if(percent>=80){

    message="🌟 খুব ভালো!";

  }else if(percent>=60){

    message="👍 ভালো হয়েছে!";

  }else{

    message="📖 Chapter-টি আরেকবার Revision করুন।";

  }

  const result=
    document.getElementById("result");

  result.innerHTML=
    `🎯 Score: ${score}/${quizData.length}
     <br>
     📊 ${percent}%
     <br>
     ${message}`;

  result.style.display="block";

}

let recentChapter=null;

function saveRecent(chapter){

  recentChapter={
    className:currentClass,
    subject:currentSubject,
    chapter:chapter
  };

  localStorage.setItem(
    "asimRecentStudy",
    JSON.stringify({
      className:currentClass,
      subject:currentSubject,
      title:chapter.title
    })
  );

  const box=
    document.getElementById("recentBox");

  document.getElementById(
    "recentTitle"
  ).textContent=
    chapter.title;

  box.classList.add("show");

}


function loadRecent(){

  try{

    const data=
      JSON.parse(
        localStorage.getItem(
          "asimRecentStudy"
        )
      );

    if(!data){

      return;

    }

    const chapter=
      DATA[data.className]
        ?. [data.subject]
        ?.chapters
        ?.find(
          c=>c.title===data.title
        );

    if(!chapter){

      return;

    }

    recentChapter={
      className:data.className,
      subject:data.subject,
      chapter:chapter
    };

    document.getElementById(
      "recentTitle"
    ).textContent=
      chapter.title;

    document.getElementById(
      "recentBox"
    ).classList.add("show");

  }catch(e){}

}


function openRecent(){

  if(!recentChapter){

    return;

  }

  currentClass=
    recentChapter.className;

  currentSubject=
    recentChapter.subject;

  renderClasses();
  renderSubjects();
  renderChapters();

  openChapter(
    recentChapter.chapter
  );

}

renderClasses();
renderSubjects();
renderChapters();
loadRecent();

</script>
