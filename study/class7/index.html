<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Class 7 Study Hub</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:linear-gradient(135deg,#07111f,#101a35,#07111f);
  color:#fff;
  min-height:100vh;
}
header{
  padding:25px 15px;
  text-align:center;
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(15px);
  border-bottom:1px solid rgba(255,255,255,.1);
}
header h1{font-size:28px;margin-bottom:8px}
header p{color:#b9c5d6;font-size:14px}

.container{
  max-width:900px;
  margin:auto;
  padding:20px 15px 50px;
}
.card{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  backdrop-filter:blur(12px);
}
h2{font-size:21px;margin-bottom:15px}
h3{margin-bottom:10px}
button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:15px;
  margin:7px 0;
  font-size:16px;
  cursor:pointer;
  background:rgba(255,255,255,.1);
  color:#fff;
  border:1px solid rgba(255,255,255,.12);
  transition:.2s;
}
button:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.17);
}
.subject{
  min-height:75px;
  text-align:left;
  font-weight:bold;
}
.subject span{
  display:block;
  font-size:13px;
  color:#aebbd0;
  margin-top:5px;
  font-weight:normal;
}
.back{
  background:#26364f;
}
.topic{
  text-align:left;
}
.topic small{
  display:block;
  color:#9eabc0;
  margin-top:5px;
}
.note{
  line-height:1.8;
  color:#e7edf6;
}
.note strong{color:#fff}
.points{
  padding-left:20px;
  line-height:1.9;
}
.points li{margin-bottom:5px}
.revision{
  background:rgba(255,255,255,.05);
  border-left:4px solid #fff;
  padding:15px;
  border-radius:8px;
  line-height:1.8;
}
.question{
  font-size:18px;
  font-weight:bold;
  line-height:1.6;
  margin-bottom:12px;
}
.option{
  text-align:left;
  background:rgba(255,255,255,.06);
}
.option.correct{
  background:rgba(40,180,100,.3);
}
.option.wrong{
  background:rgba(220,60,70,.3);
}
.result{
  text-align:center;
  padding:25px;
}
.score{
  font-size:42px;
  font-weight:bold;
  margin:10px 0;
}
.explain{
  margin-top:12px;
  padding:14px;
  background:rgba(255,255,255,.06);
  border-radius:10px;
  line-height:1.7;
  color:#dce5f2;
}
.hidden{display:none}
.badge{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  background:rgba(255,255,255,.1);
  font-size:12px;
  color:#b9c5d6;
  margin-bottom:12px;
}
.recent{
  font-size:14px;
  color:#bdc9da;
  line-height:1.8;
}
@media(max-width:600px){
  header h1{font-size:23px}
  .container{padding:15px 10px 40px}
  .card{padding:16px}
  h2{font-size:19px}
  button{font-size:15px;padding:14px}
}
</style>
</head>

<body>

<header>
  <h1>📚 Class 7 Study Hub</h1>
  <p>Expanded Study Edition • Learn • Revise • Practice</p>
</header>

<div class="container">

<!-- HOME -->
<section id="home">
  <div class="card">
    <h2>🎓 Select Subject</h2>

    <button class="subject" onclick="showSubject('বাংলা')">
      বাংলা
      <span>ভাষা ও সাহিত্য</span>
    </button>

    <button class="subject" onclick="showSubject('English')">
      English
      <span>Literature & Grammar</span>
    </button>

    <button class="subject" onclick="showSubject('গণিত')">
      গণিত
      <span>সংখ্যা, বীজগণিত ও জ্যামিতি</span>
    </button>

    <button class="subject" onclick="showSubject('Geography')">
      Geography
      <span>ভূগোল ও পরিবেশ</span>
    </button>

    <button class="subject" onclick="showSubject('Environment & Science')">
      Environment & Science
      <span>বিজ্ঞান ও পরিবেশ</span>
    </button>

    <button class="subject" onclick="showSubject('History')">
      History
      <span>ইতিহাস ও সমাজ</span>
    </button>
  </div>

  <div class="card">
    <h2>🕘 Recently Studied</h2>
    <div id="recent" class="recent">এখনও কিছু পড়া হয়নি।</div>
  </div>
</section>


<!-- TOPICS -->
<section id="topics" class="hidden">
  <div class="card">
    <button class="back" onclick="goHome()">← Back to Subjects</button>
    <h2 id="subjectTitle"></h2>
    <div id="topicList"></div>
  </div>
</section>


<!-- STUDY -->
<section id="study" class="hidden">
  <div class="card">
    <button class="back" onclick="backTopics()">← Back to Topics</button>

    <div class="badge" id="studySubject"></div>
    <h2 id="studyTitle"></h2>

    <div class="note" id="studyNote"></div>

    <br>

    <h3>⭐ Important Points</h3>
    <ul class="points" id="importantPoints"></ul>

    <br>

    <h3>📝 Revision Note</h3>
    <div class="revision" id="revision"></div>

    <br>

    <button onclick="startQuiz()">🧠 Start 10 MCQ Quiz</button>
  </div>
</section>


<!-- QUIZ -->
<section id="quiz" class="hidden">
  <div class="card">
    <button class="back" onclick="backStudy()">← Back to Study Note</button>

    <div class="badge" id="quizProgress"></div>
    <div class="question" id="question"></div>
    <div id="options"></div>
  </div>
</section>


<!-- RESULT -->
<section id="result" class="hidden">
  <div class="card result">
    <h2>🎉 Quiz Complete!</h2>
    <div class="score" id="score"></div>
    <p id="scoreText"></p>

    <br>
    <button onclick="startQuiz()">🔄 Try Again</button>
    <button onclick="backStudy()">📖 Study Again</button>
    <button class="back" onclick="goHome()">🏠 Home</button>
  </div>

  <div class="card">
    <h2>✅ Answers & Explanations</h2>
    <div id="answers"></div>
  </div>
</section>

</div>

/* =========================
   APP LOGIC
========================= */

let currentSubject="";
let currentTopic=null;
let currentQuiz=[];
let quizIndex=0;
let scoreCount=0;
let selectedAnswers=[];


/* HOME */
function goHome(){
  hideAll();
  document.getElementById("home").classList.remove("hidden");
  loadRecent();
}


/* SUBJECT */
function showSubject(subject){
  currentSubject=subject;
  hideAll();

  document.getElementById("topics").classList.remove("hidden");
  document.getElementById("subjectTitle").innerText="📘 "+subject;

  const list=document.getElementById("topicList");
  list.innerHTML="";

  data[subject].forEach((topic,i)=>{
    const b=document.createElement("button");
    b.className="topic";
    b.innerHTML=`${i+1}. ${topic.title}<small>Study Note • Important Points • 10 MCQ</small>`;
    b.onclick=()=>openTopic(i);
    list.appendChild(b);
  });
}


/* TOPIC */
function openTopic(index){
  currentTopic=data[currentSubject][index];

  localStorage.setItem(
    "class7_recent",
    JSON.stringify({
      subject:currentSubject,
      topic:currentTopic.title
    })
  );

  hideAll();
  document.getElementById("study").classList.remove("hidden");

  document.getElementById("studySubject").innerText=currentSubject;
  document.getElementById("studyTitle").innerText=currentTopic.title;
  document.getElementById("studyNote").innerText=currentTopic.note;
  document.getElementById("revision").innerText=currentTopic.revision;

  const ul=document.getElementById("importantPoints");
  ul.innerHTML="";

  currentTopic.points.forEach(p=>{
    const li=document.createElement("li");
    li.innerText=p;
    ul.appendChild(li);
  });

  loadRecent();
}


/* QUIZ */
function startQuiz(){
  currentQuiz=[...currentTopic.quiz];
  quizIndex=0;
  scoreCount=0;
  selectedAnswers=[];

  hideAll();
  document.getElementById("quiz").classList.remove("hidden");

  showQuestion();
}


function showQuestion(){

  const q=currentQuiz[quizIndex];

  document.getElementById("quizProgress").innerText=
    `Question ${quizIndex+1} of ${currentQuiz.length}`;

  document.getElementById("question").innerText=q[0];

  const options=document.getElementById("options");
  options.innerHTML="";

  const arr=[
    {text:q[1],index:0},
    {text:q[2],index:1},
    {text:q[3],index:2},
    {text:q[4],index:3}
  ];

  arr.forEach(o=>{
    const b=document.createElement("button");
    b.className="option";
    b.innerText=o.text;

    b.onclick=()=>{
      chooseAnswer(o.index,b);
    };

    options.appendChild(b);
  });
}


function chooseAnswer(index,button){

  const q=currentQuiz[quizIndex];
  const buttons=document.querySelectorAll("#options button");

  buttons.forEach(b=>b.disabled=true);

  selectedAnswers.push(index);

  if(index===q[5]){
    scoreCount++;
    button.classList.add("correct");
  }else{
    button.classList.add("wrong");
    buttons[q[5]].classList.add("correct");
  }

  setTimeout(()=>{
    quizIndex++;

    if(quizIndex<currentQuiz.length){
      showQuestion();
    }else{
      showResult();
    }
  },650);
}


/* RESULT */
function showResult(){

  hideAll();
  document.getElementById("result").classList.remove("hidden");

  const percent=Math.round((scoreCount/currentQuiz.length)*100);

  document.getElementById("score").innerText=percent+"%";

  let text="";

  if(percent>=90) text="🏆 Excellent! অসাধারণ হয়েছে!";
  else if(percent>=70) text="👏 Very Good! আরও একটু practice করো।";
  else if(percent>=50) text="👍 Good! Revision করলে আরও ভালো হবে।";
  else text="📖 আবার Study Note পড়ে Try Again করো।";

  document.getElementById("scoreText").innerText=
    `${scoreCount}/${currentQuiz.length} correct — ${text}`;

  const ans=document.getElementById("answers");
  ans.innerHTML="";

  currentQuiz.forEach((q,i)=>{

    const correct=q[q[5]+1];

    const div=document.createElement("div");
    div.className="explain";

    div.innerHTML=
      `<strong>Q${i+1}. ${q[0]}</strong><br>
      আপনার উত্তর: ${q[selectedAnswers[i]+1] || "—"}<br>
      ✅ সঠিক উত্তর: ${correct}<br>
      💡 ${q[6]}`;

    ans.appendChild(div);
  });
}


/* NAVIGATION */
function backTopics(){
  showSubject(currentSubject);
}

function backStudy(){
  hideAll();
  document.getElementById("study").classList.remove("hidden");
}


/* HIDE ALL */
function hideAll(){
  ["home","topics","study","quiz","result"].forEach(id=>{
    document.getElementById(id).classList.add("hidden");
  });
}


/* RECENT */
function loadRecent(){

  const box=document.getElementById("recent");
  const saved=localStorage.getItem("class7_recent");

  if(!saved){
    box.innerText="এখনও কিছু পড়া হয়নি।";
    return;
  }

  try{
    const r=JSON.parse(saved);

    box.innerHTML=
      `📚 <strong>${r.subject}</strong><br>
       📖 ${r.topic}<br><br>
       <button onclick="resumeRecent()">Continue Studying →</button>`;
  }catch(e){
    box.innerText="এখনও কিছু পড়া হয়নি।";
  }
}


function resumeRecent(){

  const saved=JSON.parse(localStorage.getItem("class7_recent"));

  const index=data[saved.subject]
    .findIndex(x=>x.title===saved.topic);

  if(index>=0){
    currentSubject=saved.subject;
    openTopic(index);
  }
}


/* INITIAL */
loadRecent();

</script>
