"শিক্ষক-শিক্ষার্থী ঐতিহ্য ছিল",
"গুরুকুল পরিচিত শিক্ষাব্যবস্থা",
"ভাষা ও দর্শনসহ নানা জ্ঞানচর্চা",
"শিক্ষাকেন্দ্র জ্ঞান সংরক্ষণে সাহায্য করত",
"শৃঙ্খলা ও চরিত্রগঠনের গুরুত্ব ছিল"
]
},
{
"s":"History",
"t":"প্রাচীন ভারতের বিজ্ঞান ও শিল্প",
"n":"গণিত, চিকিৎসা, ধাতুবিদ্যা, স্থাপত্য ও শিল্পে প্রাচীন ভারতের উল্লেখযোগ্য জ্ঞানচর্চা ছিল।",
"f":[
"গণিতচর্চার ঐতিহ্য ছিল",
"চিকিৎসাবিদ্যায় জ্ঞানচর্চা ছিল",
"ধাতুবিদ্যা ধাতু নিয়ে কাজ করে",
"স্থাপত্য ও ভাস্কর্য শিল্পের ক্ষেত্র",
"গ্রন্থ ও নিদর্শন থেকে তথ্য পাওয়া যায়"
]
},
{
"s":"History",
"t":"প্রাচীন ভারতীয় সংস্কৃতি",
"n":"ভাষা, সাহিত্য, শিল্প, জ্ঞান, ধর্মীয় চিন্তা ও সামাজিক রীতির সমন্বয়ে সংস্কৃতি গড়ে ওঠে।",
"f":[
"সংস্কৃতি ভাষা সাহিত্য শিল্প চিন্তা ও রীতির সমন্বয়",
"ভাষা জ্ঞান ও ভাব পৌঁছে দেয়",
"সাহিত্য চিন্তা ও অনুভূতি প্রকাশ করে",
"ঐতিহ্য প্রজন্মে চলা মূল্যবান রীতি/জ্ঞান",
"সংস্কৃতি সংরক্ষণ ঐতিহাসিক পরিচয় বজায় রাখে"
]
}
];

let cur=null;
let qi=0;
let score=0;
let locked=false;

const $=id=>document.getElementById(id);

const E=x=>String(x).replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
);

const subs=[...new Set(D.map(x=>x.s))];

$("subs").innerHTML=subs.map(s=>`
<button onclick="showTopics(${JSON.stringify(s)})">
📘 ${E(s)}
<small style="display:block;color:#91a7c4">
${D.filter(x=>x.s==s).length} Topics
</small>
</button>
`).join("");

function showTopics(s){

$("tb").classList.remove("hidden");
$("sb").classList.add("hidden");
$("qb").classList.add("hidden");

$("st").textContent=s;

$("topics").innerHTML=D
.filter(x=>x.s==s)
.map((x,i)=>`
<button class="topic" onclick="openT(${D.indexOf(x)})">
📖 ${E(x.t)}
<small>Topic ${i+1} • Notes + 10 MCQ</small>
</button>
`).join("");

$("tb").scrollIntoView({behavior:"smooth"});
}

function openT(i){

cur=D[i];

localStorage.setItem(
"class6_recent",
cur.s+" • "+cur.t
);

$("recent").textContent="Recently: "+cur.t;

$("sb").classList.remove("hidden");
$("qb").classList.add("hidden");

$("study").innerHTML=`

<span class="pill">${E(cur.s)}</span>

<h2>📖 ${E(cur.t)}</h2>

<h3>📌 Easy Study Note</h3>
<p>${E(cur.n)}</p>

<h3>⭐ Important Points</h3>

<ul>
${cur.f.map(x=>`<li>${E(x)}</li>`).join("")}
</ul>

<h3>🔄 Revision Note</h3>

<p>
প্রথমে ধারণা বুঝুন → গুরুত্বপূর্ণ তথ্য মনে রাখুন →
বই বন্ধ করে নিজের ভাষায় বলুন → ১০টি MCQ দিন।
</p>

<div class="actions">

<button class="primary" onclick="start()">
🧠 Start 10 MCQ
</button>

<button onclick="showTopics(${JSON.stringify(cur.s)})">
← Topics
</button>

</div>
`;

$("sb").scrollIntoView({behavior:"smooth"});
}

function makeQ(n){

let f=cur.f[n%cur.f.length];

let o=cur.f.filter(x=>x!=f);

let opts=[
f,
o[(n+1)%o.length],
o[(n+2)%o.length],
o[(n+3)%o.length]
];

let sh=(n*3)%4;

opts=opts.slice(sh).concat(opts.slice(0,sh));

let stems=[

"নিচের কোন বক্তব্যটি সঠিক?",

"এই অধ্যায়ের ক্ষেত্রে কোন তথ্যটি ঠিক?",

"কোনটি সঠিকভাবে ব্যাখ্যা করে?",

"নিচের কোনটি গুরুত্বপূর্ণ তথ্য?",

"কোন বক্তব্যটি মনে রাখা উচিত?",

"কোনটি এই Topic-এর সঙ্গে সরাসরি সম্পর্কিত?",

"পরীক্ষায় কোন তথ্যটি সঠিক?",

"নিচের কোন তথ্যটি অধ্যায়ের ধারণার সঙ্গে মেলে?",

"কোনটি সঠিক উদাহরণ/বৈশিষ্ট্য?",

"Revision-এ কোন বক্তব্যটি রাখা উচিত?"

];

return{
q:stems[n],
o:opts,
a:opts.indexOf(f),
e:f
};
}

function start(){

qi=0;
score=0;
locked=false;

$("qb").classList.remove("hidden");

renderQ();

$("qb").scrollIntoView({behavior:"smooth"});
}

function renderQ(){

let x=makeQ(qi);

locked=false;

$("quiz").innerHTML=`

<span class="pill">
Question ${qi+1} / 10
</span>

<h2>${E(x.q)}</h2>

<p class="muted">
Topic: ${E(cur.t)}
</p>

<div>

${x.o.map((o,i)=>`

<button
class="option"
onclick="answer(${i})">

${String.fromCharCode(65+i)}.
${E(o)}

</button>

`).join("")}

</div>

<div id="feedback" class="muted"></div>

<div class="progress">

<div
class="bar"
style="width:${qi*10}%">
</div>

</div>
`;
}

function answer(i){

if(locked)return;

locked=true;

let x=makeQ(qi);

let bs=document.querySelectorAll(".option");

bs[x.a].classList.add("correct");

if(i===x.a){

score++;

$("feedback").textContent=
"✅ Correct!";

}else{

$("feedback").textContent=
"❌ Correct answer: "+x.e;

bs[i].classList.add("wrong");
}

$("feedback").insertAdjacentHTML(
"afterend",
`
<div class="actions">

<button
class="primary"
onclick="${qi<9?"nextQ()":"finish()"}">

${qi<9?"Next →":"Finish Quiz"}

</button>

</div>
`
);
}

function nextQ(){

qi++;

renderQ();
}

function finish(){

let p=score*10;

$("quiz").innerHTML=`

<span class="pill">
QUIZ COMPLETE
</span>

<h2>
🎉 Score: ${score}/10 • ${p}%
</h2>

<p>
${
p>=80
?"Excellent! খুব ভালো হয়েছে।"
:
p>=50
?"Good! আরেকবার revision করুন।"
:
"Revision করে আবার চেষ্টা করুন।"
}
</p>

<div class="actions">

<button
class="good"
onclick="start()">

🔁 Try Again

</button>

<button
onclick="openT(${D.indexOf(cur)})">

📖 Back to Notes

</button>

</div>
`;
}

let r=localStorage.getItem("class6_recent");

if(r)
$("recent").textContent="Recently: "+r;

</script>

</body>
</html>
