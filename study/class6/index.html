.map((x,i)=>`

<button class="topic"
onclick="openT(${D.indexOf(x)})">

📖 ${esc(x.t)}

<small>
Topic ${i+1} • Notes + MCQ
</small>

</button>

`).join("");

$("topicsBox").scrollIntoView({
behavior:"smooth"
});

}


function openT(i){

cur=D[i];

localStorage.setItem(
"class6_recent",
cur.s+" • "+cur.t
);

$("recent").textContent=
"Recently: "+cur.t;

$("studyBox").classList.remove("hidden");

$("quizBox").classList.add("hidden");


$("study").innerHTML=`

<span class="pill">
${esc(cur.s)}
</span>

<h2>📖 ${esc(cur.t)}</h2>

<h3>📌 Easy Study Note</h3>

<p>${esc(cur.n)}</p>


<h3>⭐ Important Points</h3>

<p>
মূল সংজ্ঞা/ধারণা, কারণ-ফল,
উদাহরণ এবং পরীক্ষায় আসতে পারে
এমন তথ্য আলাদা করে মনে রাখুন।
</p>


<h3>🔄 Revision Note</h3>

<p>
প্রথমে ধারণা বুঝুন →
Key word মনে রাখুন →
বই বন্ধ করে নিজের ভাষায় বলুন →
তারপর MCQ দিন।
</p>


<h3>📝 Exam Practice</h3>

<p>
সংজ্ঞা, পার্থক্য, কারণ-ব্যাখ্যা,
উদাহরণ ও প্রয়োগভিত্তিক প্রশ্ন
অনুশীলন করুন।
</p>


<div class="actions">

<button class="primary"
onclick="start()">

🧠 Start 10 MCQ

</button>

<button
onclick="showTopics('${esc(cur.s)}')">

← Topics

</button>

</div>

`;

$("studyBox").scrollIntoView({
behavior:"smooth"
});

}


function makeQ(i){

let title=cur.t;
let base=cur.n;

let qs=[

[
"এই অধ্যায়ের মূল বিষয় কী?",
base
],

[
"এই অধ্যায় পড়ার সময় কোন বিষয়টি সবচেয়ে গুরুত্বপূর্ণ?",
"মূল ধারণা ও গুরুত্বপূর্ণ তথ্য বোঝা।"
],

[
"কোন পদ্ধতিতে এই অধ্যায় ভালো শেখা যায়?",
"ধারণা বুঝে উদাহরণ ও অনুশীলন করা।"
],

[
"পরীক্ষার আগে কী করা সবচেয়ে উপকারী?",
"সংক্ষিপ্ত নোট ও গুরুত্বপূর্ণ প্রশ্ন revise করা।"
],

[
"এই অধ্যায়ের ক্ষেত্রে কোনটি সঠিক?",
"মূল ধারণা বুঝে প্রয়োগ করতে পারা।"
],

[
"উদাহরণ অনুশীলন কেন দরকার?",
"ধারণাকে প্রয়োগের সঙ্গে যুক্ত করার জন্য।"
],

[
"ভালো উত্তর লেখার প্রথম ধাপ কী?",
"প্রশ্নের মূল শব্দ ও চাহিদা শনাক্ত করা।"
],

[
"দ্রুত revision-এর ভালো উপায় কোনটি?",
"Key points দেখে বই বন্ধ করে recall করা।"
],

[
"কীভাবে মনে রাখা সহজ হয়?",
"কী-শব্দ, ছোট নোট ও self-test ব্যবহার করে।"
],

[
"নিজেকে যাচাই করার ভালো উপায় কী?",
"বই না দেখে মূল ধারণা ব্যাখ্যা করা ও MCQ দেওয়া।"
]

][i];


let bad=[

"শুধু মুখস্থ করলেই সবসময় যথেষ্ট।",

"অধ্যায়ের সঙ্গে কোনো সম্পর্ক নেই।",

"শুধু ছবি দেখলেই পুরো বিষয় শেখা যায়।"

];


let o=[qs[1],...bad];

let k=i%4;

o=o.slice(k).concat(o.slice(0,k));

return{
q:qs[0],
o:o,
a:o.indexOf(qs[1]),
e:qs[1]
};

}


function start(){

q=0;
score=0;
answered=false;

$("quizBox").classList.remove("hidden");

renderQ();

$("quizBox").scrollIntoView({
behavior:"smooth"
});

}


function renderQ(){

let x=makeQ(q);

$("quiz").innerHTML=`

<span class="pill">
Question ${q+1} / 10
</span>

<h2>
${esc(x.q)}
</h2>

<div>

${x.o.map((o,i)=>`

<button
class="option"
onclick="ans(${i})">

${String.fromCharCode(65+i)}.
${esc(o)}

</button>

`).join("")}

</div>

<div id="feedback"
class="muted">
</div>

<div class="progress">

<div class="bar"
style="width:${q*10}%">
</div>

</div>

`;

}


function ans(i){

if(answered)return;

answered=true;

let x=makeQ(q);

let bs=document.querySelectorAll(".option");

bs[x.a].classList.add("correct");


if(i==x.a){

score++;

$("feedback").textContent=
"✅ Correct! "+x.e;

}

else{

$("feedback").textContent=
"❌ Correct answer: "+x.e;

bs[i].classList.add("wrong");

}


$("feedback").insertAdjacentHTML(
"afterend",

`

<div class="actions">

<button
class="primary"
onclick="${q<9?"nextQ()":"finish()"}">

${q<9?"Next →":"Finish Quiz"}

</button>

</div>

`);

}


function nextQ(){

q++;

answered=false;

renderQ();

}


function finish(){

let p=score*10;

$("quiz").innerHTML=`

<span class="pill">
QUIZ COMPLETE
</span>

<h2>
🎉 Score: ${score}/10 • ${p}%
</h2>

<p>

${
p>=80
?
"Excellent! খুব ভালো হয়েছে।"
:
p>=50
?
"Good! আরও একবার revision করলে আরও ভালো হবে।"
:
"Revision করে আবার চেষ্টা করুন।"
}

</p>


<div class="actions">

<button
class="good"
onclick="start()">

🔁 Try Again

</button>


<button
onclick="openT(${D.indexOf(cur)})">

📖 Back to Notes

</button>

</div>

`;

}


let r=localStorage.getItem("class6_recent");

if(r){

$("recent").textContent=
"Recently: "+r;

}

</script>

</body>
</html>
