<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 8 Study Hub</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,"Noto Sans Bengali",sans-serif;
color:#fff;
background:linear-gradient(135deg,#07111f,#111827,#17112b);
min-height:100vh
}
.container{max-width:1050px;margin:auto;padding:15px}
header{text-align:center;padding:25px 10px}
.logo{
width:75px;height:75px;margin:auto;border-radius:22px;
display:flex;align-items:center;justify-content:center;
font-size:38px;font-weight:bold;
background:linear-gradient(135deg,#675cff,#00c6ff);
box-shadow:0 15px 40px #0007
}
h1{font-size:30px;margin:14px 0 5px}
.subtitle{color:#aeb8ca}
.card{
background:rgba(255,255,255,.07);
border:1px solid rgba(255,255,255,.13);
border-radius:22px;
padding:20px;
backdrop-filter:blur(15px);
box-shadow:0 15px 40px #0005
}
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px
}
.subject,.topic{
padding:18px;
border-radius:18px;
background:rgba(255,255,255,.07);
border:1px solid rgba(255,255,255,.1);
cursor:pointer;
transition:.2s
}
.subject:hover,.topic:hover{
transform:translateY(-3px);
background:rgba(255,255,255,.12)
}
.icon{font-size:32px}
.small{font-size:14px;color:#aeb8ca}
button{
border:0;
padding:12px 18px;
border-radius:13px;
font-weight:bold;
color:white;
cursor:pointer;
background:linear-gradient(135deg,#695cff,#00aeea);
margin:5px
}
.back{background:rgba(255,255,255,.1)}
.topicgrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px
}
.section{margin-top:20px;line-height:1.8}
.points{line-height:1.9}
.revision{
padding:15px;
border-left:4px solid #00c6ff;
background:rgba(0,198,255,.08);
border-radius:10px;
line-height:1.7
}
.question{font-size:20px;font-weight:bold;line-height:1.5}
.options{display:grid;gap:10px;margin-top:15px}
.option{
padding:14px;
border-radius:13px;
background:rgba(255,255,255,.07);
border:1px solid rgba(255,255,255,.12);
cursor:pointer
}
.option.correct{background:rgba(40,210,120,.15);border-color:#35d07f}
.option.wrong{background:rgba(255,70,90,.15);border-color:#ff5c75}
.explanation{
margin-top:15px;
padding:15px;
background:rgba(255,255,255,.07);
border-radius:12px;
line-height:1.7
}
.score{text-align:center;font-size:45px;font-weight:bold}
.center{text-align:center}
.hidden{display:none}
.recent-item{
display:inline-block;
padding:9px 13px;
margin:4px;
border-radius:20px;
background:rgba(255,255,255,.08);
cursor:pointer
}
@media(max-width:650px){
.grid,.topicgrid{grid-template-columns:1fr}
h1{font-size:25px}
.card{padding:15px}
}
</style>
</head>

<body>

<div class="container">

<header>
<div class="logo">৮</div>
<h1>Class 8 Study Hub</h1>
<div class="subtitle">সহজভাবে পড়ো • বুঝে শেখো • MCQ দিয়ে যাচাই করো</div>
</header>

<!-- HOME -->
<div id="home" class="card">
<h2>📚 Subjects</h2>
<div id="subjects" class="grid"></div>

<div style="margin-top:25px">
<h3>🕘 Recently Studied</h3>
<div id="recent"></div>
</div>
</div>

<!-- TOPICS -->
<div id="topicsPage" class="card hidden">
<button class="back" onclick="home()">← Subjects</button>
<h2 id="subjectTitle"></h2>
<div id="topics" class="topicgrid"></div>
</div>

<!-- STUDY -->
<div id="studyPage" class="card hidden">
<button class="back" onclick="backTopics()">← Topics</button>
<h2 id="studyTitle"></h2>

<div class="section">
<h3>📖 Study Note</h3>
<div id="summary"></div>
</div>

<div class="section">
<h3>⭐ Important Points</h3>
<ul id="points" class="points"></ul>
</div>

<div class="section">
<h3>🔄 Revision Note</h3>
<div id="revision" class="revision"></div>
</div>

<div class="center" style="margin-top:20px">
<button onclick="startQuiz()">📝 Start MCQ Quiz</button>
</div>
</div>

<!-- QUIZ -->
<div id="quizPage" class="card hidden">
<button class="back" onclick="backStudy()">← Study Note</button>

<p id="counter" class="small"></p>
<div id="question" class="question"></div>
<div id="options" class="options"></div>
<div id="explanation" class="explanation hidden"></div>

<div class="center">
<button id="next" class="hidden" onclick="nextQuestion()">Next →</button>
</div>
</div>

<!-- RESULT -->
<div id="resultPage" class="card hidden">
<h2 class="center">🎉 Quiz Complete</h2>
<div id="score" class="score"></div>
<p id="resultText" class="center"></p>

<div class="center">
<button onclick="startQuiz()">🔁 Try Again</button>
<button onclick="backStudy()">📖 Study Again</button>
</div>
</div>

</div>

/* =========================
   VARIABLES
========================= */

let currentSubject="";
let currentTopic="";
let quiz=[];
let qIndex=0;
let score=0;
let answered=false;


/* =========================
   PAGE CONTROL
========================= */

function show(id){

document.getElementById("home").classList.add("hidden");
document.getElementById("topicsPage").classList.add("hidden");
document.getElementById("studyPage").classList.add("hidden");
document.getElementById("quizPage").classList.add("hidden");
document.getElementById("resultPage").classList.add("hidden");

document.getElementById(id).classList.remove("hidden");

window.scrollTo(0,0);

}


/* =========================
   LOAD SUBJECTS
========================= */

function loadSubjects(){

let box=document.getElementById("subjects");

box.innerHTML="";

Object.keys(data).forEach(function(subject){

let item=document.createElement("div");

item.className="subject";

item.innerHTML=
"<div class='icon'>"+data[subject].icon+"</div>"+
"<h3>"+subject+"</h3>"+
"<div class='small'>"+
Object.keys(data[subject].topics).length+
" Topics</div>";

item.onclick=function(){
openSubject(subject);
};

box.appendChild(item);

});

}


/* =========================
   OPEN SUBJECT
========================= */

function openSubject(subject){

currentSubject=subject;

document.getElementById("subjectTitle").innerText=
data[subject].icon+" "+subject;

let box=document.getElementById("topics");

box.innerHTML="";

Object.keys(data[subject].topics).forEach(function(topic){

let item=document.createElement("div");

item.className="topic";

item.innerHTML=
"<b>"+topic+"</b><br>"+
"<span class='small'>Study Note • MCQ Quiz</span>";

item.onclick=function(){
openTopic(topic);
};

box.appendChild(item);

});

show("topicsPage");

}


/* =========================
   OPEN TOPIC
========================= */

function openTopic(topic){

currentTopic=topic;

let summary=data[currentSubject].topics[topic];

document.getElementById("studyTitle").innerText=
data[currentSubject].icon+" "+topic;

document.getElementById("summary").innerText=summary;

let points=document.getElementById("points");

points.innerHTML="";

makePoints(topic).forEach(function(p){

let li=document.createElement("li");

li.innerText=p;

points.appendChild(li);

});

document.getElementById("revision").innerText=
"মনে রাখবে: "+summary+
" এই বিষয়ের মূল ধারণা বুঝে নিয়মিত Revision করলে প্রস্তুতি আরও ভালো হবে।";

saveRecent(currentSubject,topic);

show("studyPage");

}


/* =========================
   RECENT
========================= */

function saveRecent(subject,topic){

let recent=JSON.parse(
localStorage.getItem("class8_recent") || "[]"
);

recent=recent.filter(function(x){
return !(x.subject===subject && x.topic===topic);
});

recent.unshift({
subject:subject,
topic:topic
});

recent=recent.slice(0,8);

localStorage.setItem(
"class8_recent",
JSON.stringify(recent)
);

loadRecent();

}


function loadRecent(){

let box=document.getElementById("recent");

let recent=JSON.parse(
localStorage.getItem("class8_recent") || "[]"
);

box.innerHTML="";

if(recent.length===0){

box.innerHTML=
"<span class='small'>এখনও কোনো Topic পড়া হয়নি।</span>";

return;

}

recent.forEach(function(x){

let item=document.createElement("span");

item.className="recent-item";

item.innerText=x.topic;

item.onclick=function(){

currentSubject=x.subject;

openTopic(x.topic);

};

box.appendChild(item);

});

}


/* =========================
   QUIZ
========================= */

function startQuiz(){

quiz=makeQuiz(
currentTopic,
data[currentSubject].topics[currentTopic]
);

quiz=quiz.sort(function(){
return Math.random()-0.5;
});

qIndex=0;
score=0;
answered=false;

show("quizPage");

renderQuestion();

}


function renderQuestion(){

answered=false;

let q=quiz[qIndex];

document.getElementById("counter").innerText=
"Question "+(qIndex+1)+" / "+quiz.length;

document.getElementById("question").innerText=q[0];

let options=document.getElementById("options");

options.innerHTML="";

for(let i=1;i<=4;i++){

let item=document.createElement("div");

item.className="option";

item.innerText=q[i];

item.onclick=function(){
selectAnswer(i-1,item);
};

options.appendChild(item);

}

document.getElementById("explanation").classList.add("hidden");

document.getElementById("next").classList.add("hidden");

}


function selectAnswer(index,element){

if(answered)return;

answered=true;

let q=quiz[qIndex];

let correct=q[5];

let all=document.querySelectorAll(".option");

all.forEach(function(item,i){

if(i===correct){
item.classList.add("correct");
}

});

if(index===correct){

score++;

element.classList.add("correct");

}else{

element.classList.add("wrong");

}

let exp=document.getElementById("explanation");

exp.innerHTML=
(index===correct ? "✅ Correct!" : "❌ Wrong!")+ 
"<br><br><b>Correct Answer:</b> "+
q[correct+1]+
"<br><br>"+
q[6];

exp.classList.remove("hidden");

let next=document.getElementById("next");

next.innerText=
qIndex===quiz.length-1 ?
"See Result →" :
"Next →";

next.classList.remove("hidden");

}


function nextQuestion(){

if(qIndex<quiz.length-1){

qIndex++;

renderQuestion();

}else{

showResult();

}

}


/* =========================
   RESULT
========================= */

function showResult(){

let percent=
Math.round((score/quiz.length)*100);

document.getElementById("score").innerText=
percent+"%";

let message="";

if(percent>=80){

message="🌟 Excellent! খুব ভালো হয়েছে।";

}else if(percent>=60){

message="👍 Good! আরও একটু Revision করো।";

}else{

message="📚 আরও একটু পড়ো এবং আবার চেষ্টা করো।";

}

document.getElementById("resultText").innerText=
message+
" তুমি "+score+
" / "+quiz.length+
" সঠিক উত্তর দিয়েছ।";

show("resultPage");

}


/* =========================
   NAVIGATION
========================= */

function home(){

show("home");

loadRecent();

}

function backTopics(){

openSubject(currentSubject);

}

function backStudy(){

openTopic(currentTopic);

}


/* =========================
   START
========================= */

loadSubjects();

loadRecent();
