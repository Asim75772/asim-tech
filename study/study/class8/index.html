<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 8 Study Hub</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:linear-gradient(135deg,#07111f,#101827,#17112b);
  color:#fff;
  min-height:100vh;
}
.container{max-width:1050px;margin:auto;padding:18px}
header{
  text-align:center;
  padding:28px 10px;
}
.logo{
  width:72px;height:72px;border-radius:22px;
  background:linear-gradient(135deg,#6d5dfc,#00c6ff);
  display:flex;align-items:center;justify-content:center;
  margin:auto;font-size:34px;font-weight:bold;
  box-shadow:0 15px 40px #0008;
}
h1{margin:14px 0 5px;font-size:30px}
.subtitle{color:#aeb8ca}
.glass{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(14px);
  border-radius:22px;
  padding:20px;
  box-shadow:0 15px 40px #0005;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}
.subject{
  padding:20px;
  border-radius:20px;
  cursor:pointer;
  background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.12);
  transition:.2s;
}
.subject:hover{transform:translateY(-3px)}
.subject .icon{font-size:32px}
.subject h3{margin:10px 0 5px}
.small{color:#aeb8ca;font-size:14px}

button{
  border:0;
  border-radius:13px;
  padding:12px 18px;
  cursor:pointer;
  font-weight:bold;
  background:linear-gradient(135deg,#695cff,#00aeea);
  color:#fff;
}
.back{
  background:rgba(255,255,255,.1);
  margin-bottom:15px;
}
.topic-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.topic{
  padding:17px;
  border-radius:17px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  cursor:pointer;
}
.topic:hover{background:rgba(255,255,255,.1)}

.section{margin-top:18px}
.section h3{margin-bottom:10px}
.points{
  padding-left:20px;
  line-height:1.8;
}
.revision{
  background:rgba(0,200,255,.08);
  border-left:4px solid #00c6ff;
  padding:15px;
  border-radius:10px;
  line-height:1.7;
}
.question{
  font-size:20px;
  font-weight:bold;
  line-height:1.5;
}
.options{
  display:grid;
  gap:10px;
  margin-top:16px;
}
.option{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  padding:14px;
  border-radius:13px;
  cursor:pointer;
}
.option:hover{background:rgba(255,255,255,.13)}
.option.selected{border-color:#00c6ff}
.option.correct{border-color:#35d07f;background:rgba(53,208,127,.12)}
.option.wrong{border-color:#ff5c75;background:rgba(255,92,117,.12)}
.explanation{
  margin-top:15px;
  padding:14px;
  background:rgba(255,255,255,.06);
  border-radius:12px;
  line-height:1.6;
}
.score{
  text-align:center;
  font-size:42px;
  font-weight:bold;
  margin:20px;
}
.center{text-align:center}
.hidden{display:none}
.recent{
  margin-top:25px;
}
.recent-item{
  display:inline-block;
  padding:9px 13px;
  margin:5px;
  border-radius:20px;
  background:rgba(255,255,255,.08);
  cursor:pointer;
  font-size:14px;
}

@media(max-width:650px){
  .grid,.topic-grid{grid-template-columns:1fr}
  h1{font-size:25px}
  .container{padding:12px}
  .glass{padding:15px}
}
</style>
</head>

<body>
<div class="container">

<header>
  <div class="logo">৮</div>
  <h1>Class 8 Study Hub</h1>
  <div class="subtitle">সহজভাবে পড়ো • বুঝে শেখো • MCQ দিয়ে যাচাই করো</div>
</header>

<!-- HOME -->
<div id="home" class="glass">
  <h2>📚 Subjects</h2>
  <div id="subjects" class="grid"></div>

  <div class="recent">
    <h3>🕘 Recently Studied</h3>
    <div id="recentList"></div>
  </div>
</div>

<!-- TOPICS -->
<div id="topicsPage" class="glass hidden">
  <button class="back" onclick="goHome()">← Subjects</button>
  <h2 id="subjectTitle"></h2>
  <p class="small">একটি Topic নির্বাচন করুন</p>
  <div id="topics" class="topic-grid"></div>
</div>

<!-- STUDY -->
<div id="studyPage" class="glass hidden">
  <button class="back" onclick="backTopics()">← Topics</button>
  <h2 id="studyTitle"></h2>

  <div class="section">
    <h3>📖 Study Note</h3>
    <div id="summary"></div>
  </div>

  <div class="section">
    <h3>⭐ Important Points</h3>
    <ul id="points" class="points"></ul>
  </div>

  <div class="section">
    <h3>🔄 Revision Note</h3>
    <div id="revision" class="revision"></div>
  </div>

  <div class="center" style="margin-top:20px">
    <button onclick="startQuiz()">📝 Start MCQ Quiz</button>
  </div>
</div>

<!-- QUIZ -->
<div id="quizPage" class="glass hidden">
  <button class="back" onclick="backStudy()">← Study Note</button>

  <div class="small" id="quizCount"></div>
  <div class="question" id="question"></div>
  <div id="options" class="options"></div>
  <div id="explanation" class="explanation hidden"></div>

  <div class="center" style="margin-top:18px">
    <button id="nextBtn" class="hidden" onclick="nextQuestion()">Next →</button>
  </div>
</div>

<!-- RESULT -->
<div id="resultPage" class="glass hidden">
  <h2 class="center">🎉 Quiz Complete</h2>
  <div class="score" id="score"></div>
  <div class="center" id="resultText"></div>

  <div class="center" style="margin-top:20px">
    <button onclick="startQuiz()">🔁 Try Again</button>
    <button onclick="backStudy()">📖 Study Again</button>
  </div>
</div>

</div>

let currentSubject="";
let currentTopic="";
let quiz=[];
let qIndex=0;
let score=0;
let answered=false;

const subjectsEl=document.getElementById("subjects");
const recentList=document.getElementById("recentList");

function show(id){
  ["home","topicsPage","studyPage","quizPage","resultPage"]
  .forEach(x=>document.getElementById(x).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  window.scrollTo(0,0);
}

function loadSubjects(){
  subjectsEl.innerHTML="";
  Object.entries(data).forEach(([name,obj])=>{
    const div=document.createElement("div");
    div.className="subject";
    div.innerHTML=`
      <div class="icon">${obj.icon}</div>
      <h3>${name}</h3>
      <div class="small">${Object.keys(obj.topics).length} Topics</div>
    `;
    div.onclick=()=>openSubject(name);
    subjectsEl.appendChild(div);
  });
}

function openSubject(name){
  currentSubject=name;
  document.getElementById("subjectTitle").textContent=
    data[name].icon+" "+name;
  const box=document.getElementById("topics");
  box.innerHTML="";

  Object.keys(data[name].topics).forEach(topic=>{
    const div=document.createElement("div");
    div.className="topic";
    div.innerHTML=`<b>${topic}</b><br>
    <span class="small">Study Note • MCQ Quiz</span>`;
    div.onclick=()=>openTopic(topic);
    box.appendChild(div);
  });

  show("topicsPage");
}

function openTopic(topic){
  currentTopic=topic;
  const obj=data[currentSubject].topics[topic];

  document.getElementById("studyTitle").textContent=
    data[currentSubject].icon+" "+topic;

  document.getElementById("summary").textContent=obj.summary;

  const points=document.getElementById("points");
  points.innerHTML="";
  obj.points.forEach(p=>{
    const li=document.createElement("li");
    li.textContent=p;
    points.appendChild(li);
  });

  document.getElementById("revision").textContent=obj.revision;

  saveRecent(currentSubject,topic);
  show("studyPage");
}

function saveRecent(subject,topic){
  let recent=JSON.parse(localStorage.getItem("class8_recent")||"[]");
  const item={subject,topic};
  recent=recent.filter(x=>!(x.subject===subject&&x.topic===topic));
  recent.unshift(item);
  recent=recent.slice(0,8);
  localStorage.setItem("class8_recent",JSON.stringify(recent));
  loadRecent();
}

function loadRecent(){
  let recent=JSON.parse(localStorage.getItem("class8_recent")||"[]");
  recentList.innerHTML="";

  if(!recent.length){
    recentList.innerHTML='<span class="small">এখনও কোনো Topic পড়া হয়নি।</span>';
    return;
  }

  recent.forEach(x=>{
    const div=document.createElement("span");
    div.className="recent-item";
    div.textContent=x.topic;
    div.onclick=()=>{
      currentSubject=x.subject;
      openTopic(x.topic);
    };
    recentList.appendChild(div);
  });
}

function startQuiz(){
  quiz=[...data[currentSubject].topics[currentTopic].mcq];
  quiz=quiz.sort(()=>Math.random()-.5);
  qIndex=0;
  score=0;
  answered=false;
  show("quizPage");
  renderQuestion();
}

function renderQuestion(){
  answered=false;
  const q=quiz[qIndex];

  document.getElementById("quizCount").textContent=
    `Question ${qIndex+1} of ${quiz.length}`;

  document.getElementById("question").textContent=q[0];

  const options=document.getElementById("options");
  options.innerHTML="";

  q.slice(1,5).forEach((opt,i)=>{
    const div=document.createElement("div");
    div.className="option";
    div.textContent=opt;
    div.onclick=()=>selectAnswer(i,div);
    options.appendChild(div);
  });

  document.getElementById("explanation").classList.add("hidden");
  document.getElementById("nextBtn").classList.add("hidden");
}

function selectAnswer(index,element){
  if(answered)return;
  answered=true;

  const q=quiz[qIndex];
  const correct=q[5];

  [...document.querySelectorAll(".option")].forEach((el,i)=>{
    if(i===correct)el.classList.add("correct");
  });

  if(index===correct){
    score++;
    element.classList.add("correct");
  }else{
    element.classList.add("wrong");
  }

  const exp=document.getElementById("explanation");
  exp.innerHTML=
    `<b>${index===correct?"✅ Correct!":"❌ Wrong!"}</b><br>
     <b>Correct Answer:</b> ${q[correct+1]}<br><br>
     ${q[6]}`;
  exp.classList.remove("hidden");

  const next=document.getElementById("nextBtn");
  next.textContent=
    qIndex===quiz.length-1?"See Result →":"Next →";
  next.classList.remove("hidden");
}

function nextQuestion(){
  if(qIndex<quiz.length-1){
    qIndex++;
    renderQuestion();
  }else{
    showResult();
  }
}

function showResult(){
  const percent=Math.round((score/quiz.length)*100);
  document.getElementById("score").textContent=percent+"%";

  let text="";
  if(percent>=80){
    text="🌟 Excellent! খুব ভালো হয়েছে।";
  }else if(percent>=60){
    text="👍 Good! আরেকবার Revision করলে আরও ভালো হবে।";
  }else{
    text="📚 আরও একটু পড়ো এবং আবার চেষ্টা করো।";
  }

  document.getElementById("resultText").textContent=
    `${text}  তুমি ${score} / ${quiz.length} সঠিক উত্তর দিয়েছ।`;

  show("resultPage");
}

function goHome(){
  show("home");
  loadRecent();
}

function backTopics(){
  openSubject(currentSubject);
}

function backStudy(){
  openTopic(currentTopic);
}

loadSubjects();
loadRecent();
</script>
